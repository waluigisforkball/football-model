/** One matchup: a team's offense vs what the opposing defense allows, 2025 faded behind 2026. */
function matchChart(label, stat, offT, defT){
  const gd = S.gd, W = 290, H = 118, px = 8, py = 14, gap = 12;
  const pick = (d, t, k) => ((d.teams || {})[t] || []).map(e => ({ v:e[k], w:e.w, opp:e.opp })).filter(e => e.v !== null);
  const o0 = pick(gd.prev, offT, stat), o1 = pick(gd.cur, offT, stat);
  const d0 = pick(gd.prev, defT, stat+'_a'), d1 = pick(gd.cur, defT, stat+'_a');
  const lgSrc = (gd.cur.league && (gd.cur.teams[offT]||[]).length >= 4) ? gd.cur.league : gd.prev.league;
  const lg = lgSrc ? lgSrc[stat] : null;
  const n0 = Math.max(o0.length, d0.length, 1), n1 = Math.max(o1.length, d1.length, 1);
  const all = [...o0, ...o1, ...d0, ...d1].map(e => e.v).concat(lg !== null ? [lg] : []);
  if (!all.length) return '';
  const lo = Math.min(...all) * 0.9, hi = Math.max(...all) * 1.05 || 1;
  // last season takes ~70% of the width, this season the rest — this season stays readable at 2 games
  const w0 = (W - px*2 - gap) * 0.68, w1 = (W - px*2 - gap) - w0;
  const X0 = i => px + (n0 > 1 ? i * w0 / (n0 - 1) : w0/2), X1 = i => px + w0 + gap + (n1 > 1 ? i * w1 / (n1 - 1) : w1/2);
  const Y = v => py + (H - py*2) * (1 - (v - lo) / (hi - lo));
  const line = (a, X, col, op, sw) => a.length > 1 ? `<polyline fill="none" stroke="${col}" stroke-opacity="${op}" stroke-width="${sw}"
      stroke-linejoin="round" points="${a.map((e,i) => X(i)+','+Y(e.v)).join(' ')}"/>` : '';
  const dots = (a, X, col, op, r, yr, who) => a.map((e,i) => `<circle cx="${X(i)}" cy="${Y(e.v)}" r="${r}" fill="${col}" fill-opacity="${op}"
      data-t="${who} · ${yr} wk ${e.w} vs ${e.opp}: ${Math.round(e.v)}"><title>${who} · ${yr} wk ${e.w} vs ${e.opp}: ${Math.round(e.v)}</title></circle>`).join('');
  const avg = a => a.length ? Math.round(a.reduce((s,e) => s + e.v, 0) / a.length) : '—';
  const divX = px + w0 + gap/2;
  const oLbl = `${offT} ${label.toLowerCase()}`, dLbl = `${defT} allowed`;
  return `<div class="mc">
    <div class="mc-h"><b>${label}</b><span style="font-family:var(--fm);color:var(--t3)">${offT} O vs ${defT} D</span></div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${oLbl} versus ${dLbl}">
      ${lg !== null ? `<line x1="${px}" x2="${W-px}" y1="${Y(lg)}" y2="${Y(lg)}" stroke="#8e8e93" stroke-dasharray="3 3" stroke-width="1"/>` : ''}
      <line x1="${divX}" x2="${divX}" y1="3" y2="${H-3}" stroke="#48484a" stroke-width="1"/>
      <text x="${divX-4}" y="10" text-anchor="end" font-size="9" fill="#8e8e93">${PRIOR_SEASON}</text>
      <text x="${divX+4}" y="10" font-size="9" fill="#ff9f0a">${SEASON}</text>
      ${line(o0, X0, '#ff9f0a', .22, 1.4)}${line(d0, X0, '#0a84ff', .22, 1.4)}
      ${line(o1, X1, '#ff9f0a', 1, 2.4)}${line(d1, X1, '#0a84ff', 1, 2.4)}
      ${dots(o0, X0, '#ff9f0a', .3, 2.2, PRIOR_SEASON, oLbl)}${dots(d0, X0, '#0a84ff', .3, 2.2, PRIOR_SEASON, dLbl)}
      ${dots(o1, X1, '#ff9f0a', 1, 3.6, SEASON, oLbl)}${dots(d1, X1, '#0a84ff', 1, 3.6, SEASON, dLbl)}
    </svg>
    <div class="mc-f"><span style="color:var(--g)">${offT} ${avg(o1)}/g</span><span style="color:var(--bl)">${defT} allows ${avg(d1)}/g</span>
      <span>lg ${lg !== null ? Math.round(lg) : '—'}</span></div>
    <div class="mc-r">tap a point</div></div>`;
}

function chartsBody(g){
  if (S.gdErr) return `<div class="note">Charts unavailable: ${S.gdErr}.</div>`;
  if (!S.gd) return `<div class="note"><span class="spin"></span> loading…</div>`;
  const pairs = [['Rushing','rush'],['Passing','pass'],['Points','pts']];
  return `<div class="legend"><span><i style="background:var(--g)"></i>offense</span>
      <span><i style="background:var(--bl)"></i>defense allowed</span>
      <span><i style="background:none;border-top:1px dashed #8e8e93;height:0"></i>league avg</span>
      <span style="color:var(--t3)">faded = ${PRIOR_SEASON} · bright = ${SEASON}</span></div>
    <div class="mgrid">${pairs.map(([l,k]) => matchChart(l, k, g.away, g.home) + matchChart(l, k, g.home, g.away)).join('')}</div>`;
}

/** Injury-report regulars, both sides of the ball: 60%+ of snaps this season or last — 40%+ for
    QB/RB/WR/TE, who rotate (a slot receiver or lead back often sits at 45-55% and still matters). */
/* Game statuses (Out / Doubtful / Questionable) are published Friday for Sunday games
   (two days ahead for Thursday and Monday games). Before that, the practice report
   is all there is, so it's shown too: DNP and limited, with veteran rest days marked
   as rest. Practice-only entries never move the projections. */
function injTier(i){
  const s = i.status || '', pr = i.practice || '', why = (i.injury || '').toLowerCase();
  if (/^out/i.test(s))      return { k:0, tag:'OUT',  cls:'out', label:'out' };
  if (/^doubt/i.test(s))    return { k:1, tag:'D',    cls:'out', label:'doubtful' };
  if (/^question/i.test(s)) return { k:2, tag:'Q',    cls:'q',   label:'questionable' };
  const rest = /not injury related/.test(why);
  if (/did not/i.test(pr))  return rest ? { k:5, tag:'REST', cls:'rest', label:'rest day', rest:true }
                                       : { k:3, tag:'DNP',  cls:'dnp', label:'did not practice', practice:true };
  if (/limited/i.test(pr))  return rest ? null : { k:4, tag:'LP', cls:'lp', label:'limited', practice:true };
  return null;                                                      // full participant
}

/** Has this team's final report for the game been published? Any game status on the team
    says yes; so does the clock (reports land ~4 PM ET two days before kickoff). After that,
    a practice-only entry means "no designation" — expected to play — so it isn't shown. */
function finalReportOut(team, g){
  if (S.injuries.some(i => i.team === team && i.status)) return true;
  const d = new Date(`${g.gameday}T16:00:00`); d.setDate(d.getDate() - 2);
  return Date.now() >= d.getTime();
}

function notableInjuries(g){
  const out = [], final = { [g.home]: finalReportOut(g.home, g), [g.away]: finalReportOut(g.away, g) };
  for (const i of S.injuries) {
    if (i.team !== g.home && i.team !== g.away) continue;
    const tier = injTier(i); if (!tier) continue;
    if ((tier.practice || tier.rest) && final[i.team]) continue;
    const n = normName(i.name);
    const c = S.gd ? S.gd.snaps.get(n + '|' + i.team) : null, p = S.gd ? S.gd.prior.get(n) : null;
    const off = Math.max(c ? c[1] : 0, p ? p[1] : 0), def = Math.max(c ? c[2] : 0, p ? p[2] : 0);
    const bar = SKILL_POS.test(i.position || '') ? 0.4 : 0.6;
    if (S.gd && Math.max(off, def) < bar) continue;
    out.push({ ...i, tier, side: off >= def ? 'O' : 'D', snap: Math.max(off, def),
               modeled: OUT_RE.test(i.status || '') && SKILL_POS.test(i.position || '') });
  }
  return out.sort((a,b) => a.tier.k - b.tier.k || b.snap - a.snap);
}

function injuriesBody(g, list){
  if (!S.gd && !S.gdErr) return `<div class="note"><span class="spin"></span> loading snap shares…</div>`;
  const team = t => {
    const xs = list.filter(i => i.team === t);
    return `<div class="gbox" style="margin:0;background:var(--bg3);border:none">
      <div style="font-family:var(--fd);font-weight:700;margin-bottom:3px">${t}</div>
      ${xs.length ? xs.map(i => `<div class="irow">
          <span class="st ${i.tier.cls}" title="${i.tier.label}">${i.tier.tag}</span>
          <span style="flex:1">${i.position} ${i.name}${i.modeled?' <span class="bdg info" style="margin-left:4px">in projections</span>':''}</span>
          <span style="color:var(--t3);font-size:11.5px;font-family:var(--fm)">${i.injury && !i.tier.rest ? i.injury.toLowerCase()+' · ' : ''}${i.side} ${Math.round(i.snap*100)}%</span>
        </div>`).join('') : '<div class="note">No regulars on the report.</div>'}
    </div>`;
  };
  const pre = !finalReportOut(g.home, g) || !finalReportOut(g.away, g);
  return `<div class="mgrid">${team(g.away)}${team(g.home)}</div>
    ${pre ? `<div class="note" style="margin-top:7px;color:var(--g)">Game statuses aren't out yet — they post
      ${gameStatusDay(g)}. Until then this is the practice report: <b>DNP</b> didn't practice,
      <b>LP</b> limited, <b>REST</b> a scheduled veteran day off.</div>` : ''}
    <div class="note" style="margin-top:7px">Regulars only: 60%+ of snaps, or 40%+ for QB/RB/WR/TE. Out/Doubtful skill players are
      redistributed in the projections; practice reports, questionable players and defenders are context the model doesn't use.</div>`;
}

/** When a game's final injury statuses are published: two days before kickoff. */
function gameStatusDay(g){
  const k = new Date(`${g.gameday}T12:00:00`); k.setDate(k.getDate() - 2);
  return k.toLocaleDateString('en-US', { weekday:'long' });
}

function weatherLine(g, p){
  const wx = S.wx[g.game_id];
  if (p.wf.indoor) return `<div class="gbox wxline"><span>Indoors</span><span style="color:var(--t3);font-family:var(--fb)">no weather adjustment</span></div>`;
  if (!wx) return `<div class="gbox wxline"><span style="color:var(--t3);font-family:var(--fb)">Forecast not available yet (${g.roof||'outdoors'})</span></div>`;
  const hit = p.wf.mult < 1;
  return `<div class="gbox wxline ${hit?'hit':''}"><span>💨 ${wx.wind} mph</span><span>🌡 ${wx.temp}°F</span>
    ${wx.precip !== null && wx.precip !== undefined ? `<span>☔ ${wx.precip}%</span>` : ''}
    <span style="color:${hit?'var(--bl)':'var(--t3)'};font-family:var(--fb)">${hit
      ? `wind trims passing efficiency ${Math.round((1-p.wf.mult)*100)}% in the model` : 'no passing adjustment'}</span></div>`;
}

function propsBody(g){
  _gameRows = []; _gameEdges = 0;
  if (!S.props.length) return `<div class="note">No odds pulled for Week ${S.week}. Use ↓ Pull odds on the Edges tab.</div>`;
  const res = buildEdges();
  const tag = new Map();
  for (const e of res.priced) tag.set(e, 'edge');
  for (const e of res.suspect || []) tag.set(e, 'quarantined');
  for (const e of res.lowvol || []) tag.set(e, 'low volume');
  _gameRows = [...(res.all || []), ...(res.suspect || []), ...(res.lowvol || [])]
    .filter(e => e.game.game_id === g.game_id)
    .sort((a,b) => (tag.get(a)==='edge'?0:1) - (tag.get(b)==='edge'?0:1) || b.best.ev - a.best.ev);
  _gameEdges = _gameRows.filter(e => tag.get(e) === 'edge').length;
  if (!_gameRows.length) return `<div class="note">No projectable props posted for this game.</div>`;
  return _gameRows.map((e,i) => {
    const t = tag.get(e), b = e.best;
    return `<div class="prow" data-i="${i}">
      <span style="flex:1">${e.prop.player} <span style="color:var(--t3);font-size:11px">${MKT[e.prop.market].label}</span>
        ${t==='edge'?`<span class="e-dir ${b.dir}" style="margin-left:4px">${b.dir.toUpperCase()} · +${R(b.ev,1)}% EV</span>`
          : t ? `<span class="bdg ${t==='quarantined'?'bad':''}" style="margin-left:4px">${t}</span>` : ''}</span>
      <span style="font-family:var(--fm);color:var(--t2);width:52px;text-align:right">${e.prop.line}</span>
      <span style="font-family:var(--fm);color:var(--g);width:70px;text-align:right">proj ${R(e.pj.mean, e.prop.market==='player_receptions'?1:0)}</span>
    </div>`;
  }).join('');
}

function renderGame(){
  const g = S.games.find(x => x.game_id === S.game);
  if (!g) { $('main').innerHTML = `<div class="gpage"><button class="gback" onclick="leaveGame()">‹ Slate</button>
      <div class="empty">That game isn't on the Week ${S.week} slate.</div></div>`; return; }
  loadGameData();
  const p = project(g), conf = confidence(g);
  const ol = [g.away,g.home].map(t => S.oline[t] ? `${t}: ${S.oline[t].players.map(x=>x.name+' ('+x.status+')').join(', ')}` : null).filter(Boolean);
  const inj = notableInjuries(g);
  const nOut = inj.filter(i => i.tier.k <= 1).length, nQ = inj.filter(i => i.tier.k === 2).length;
  const nDnp = inj.filter(i => i.tier.k === 3).length, nLp = inj.filter(i => i.tier.k === 4).length;
  const injSum = [nOut && `${nOut} out`, nQ && `${nQ} questionable`, nDnp && `${nDnp} DNP`, nLp && `${nLp} limited`]
                   .filter(Boolean).join(' · ') || 'none';
  const props = S.props.filter(x => x.game === g.away+'@'+g.home).length;
  const pb = propsBody(g);
  const nEdge = _gameEdges;

  $('main').innerHTML = `<div class="gpage">
    <button class="gback" onclick="leaveGame()">‹ ${S.tab === 'slate' ? 'Slate' : 'Edges'}</button>
    <div class="ghead">
      <div style="flex:1;min-width:220px">
        <h1>${g.away}<span class="at">@</span>${g.home}</h1>
        <div class="gsub">${spreadTxt(g)} · total ${g.total ?? '—'} · ${fmtKick(g)}</div>
        <div class="gsub" style="color:var(--t3)">${g.away_qb||'?'} vs ${g.home_qb||'?'} · ${g.stadium||''}${g.surface?' · '+g.surface:''}</div>
      </div>
      ${S.props.length ? `<div class="comp"><div class="comp-v" style="color:${nEdge ? 'var(--g)' : 'var(--t3)'}">${nEdge || '—'}</div><div class="comp-l">${nEdge === 1 ? 'edge' : 'edges'}</div></div>` : ''}
    </div>
    ${p.disagree!==null&&Math.abs(p.disagree)>=4?`<div class="warn" style="margin-bottom:10px">
      <b>Model disagrees by ${R(Math.abs(p.disagree),1)} points</b> (${R(p.modelTotal,1)} vs ${g.total}).
      Against a market this sharp, that usually means stale inputs, not an edge. Check injuries first.</div>`:''}
    <div class="gbox">${projTable(g, p)}
      <div class="note" style="margin-top:8px">Data confidence ${Math.round(conf*100)}%.${ol.length?' O-line on the report — '+ol.join(' · '):''}</div></div>
    ${weatherLine(g, p)}
    ${gx('charts', 'Matchups', 'rushing · passing · points', chartsBody(g))}
    ${gx('inj', 'Notable injuries', !S.gd && !S.gdErr ? '…' : injSum, injuriesBody(g, inj))}
    ${gx('props', 'Props in this game', props ? `${props} posted${nEdge?` · ${nEdge} edge${nEdge>1?'s':''}`:''}` : 'no odds', pb)}
  </div>`;

  document.querySelectorAll('details.gx').forEach(d => d.addEventListener('toggle', () => {
    openState[d.dataset.k] = d.open; store.set('nflslate.gopen', openState);
  }));
  document.querySelectorAll('.mc').forEach(mc => mc.addEventListener('click', ev => {
    const c = ev.target.closest('circle'); if (c) mc.querySelector('.mc-r').textContent = c.dataset.t;
  }));
  document.querySelectorAll('.prow').forEach(el => el.onclick = () => { const e = _gameRows[+el.dataset.i]; if (e) openEdgeObj(e); });
  window.scrollTo(0, 0);
}

function closeModal(){ $('modal').classList.remove('open'); }

/* ---------- rundown ---------- */
function rundown(){
  const L = [`NFL SLATE — Week ${S.week} (${SEASON})`,
             `anchor ${S.anchor}% · min EV +${S.minev}% · ${S.lastn>=99?'season':'L'+S.lastn} window`, ''];
  if (!Object.keys(S.pPrior.players || {}).length || !Object.keys(S.pRates.players || {}).length)
    return L.concat(['Board withheld — player data failed to load.']).join('\n');
  const res = buildEdges();
  if (res.cal) {
    L.push('Calibration (lean vs fair, pts): ' + res.cal.rows.map(r =>
      `${MKT[r.market].label} ${r.enough ? (r.bias>0?'+':'')+R(r.bias,1) : 'n/a'}${r.bad?' ⚠':''}`).join(' · '), '');
  }
  if (!res.priced || !res.priced.length) L.push('No edges clear the threshold.');
  else for (const e of res.priced){
    const b = e.best, p = e.prop;
    L.push(`${b.ev>0?'+':''}${R(b.ev,1)}%  ${p.player} ${b.dir.toUpperCase()} ${p.line} ${MKT[p.market].label}  ${am(b.price)}`);
    L.push(`        proj ${R(e.pj.mean,1)} · ${p.game} · ${Math.round(b.p*100)}% vs ${Math.round(b.fair*100)}% fair · ${R(b.pts,1)} pts`);
    if (e.badges.length) L.push('        flags: ' + e.badges.map(x=>x[1]).join(', '));
    L.push('');
  }
  L.push('', '--- SLATE ---', '');
  for (const g of S.games){
    const p = project(g);
    L.push(`${g.away} @ ${g.home}  (${spreadTxt(g)}, ${g.total})`);
    L.push(`     ${g.away}: ${R(p.away.att,0)} att / ${R(p.away.pass_yards,0)} pyd · ${R(p.away.carries,0)} car / ${R(p.away.rush_yards,0)} ryd`);
    L.push(`     ${g.home}: ${R(p.home.att,0)} att / ${R(p.home.pass_yards,0)} pyd · ${R(p.home.carries,0)} car / ${R(p.home.rush_yards,0)} ryd`);
  }
  return L.join('\n');
}

$('bGuide').onclick = () => showModal(`<h2>How this works</h2>
  <p>Every claim starts from the market's view of the game, distributes it to players by usage
     share, then compares the result to the posted line as a probability.</p>

  <h4>EV% and probability points</h4>
  <p><b>Probability points</b> is how much more often the model thinks this hits than the devigged
     book price implies. <b>EV%</b> is your return per dollar at the actual price you'd get.
     They differ because price matters: +5 points at -105 is a much better bet than +5 at -130.
     Break-even is 52.4% at -110, 53.5% at -115, 54.5% at -120.</p>

  <h4>Why edges look small</h4>
  <p>The distributions are wide. A quarterback projected 10 yards above a 245.5 line is only about
     6 probability points, because passing yards carry a standard deviation near 65.
     Most props that feel like locks aren't. A big number here is a reason to check your inputs,
     not a reason to bet more.</p>

  <h4>Outcome shapes</h4>
  <p>Passing yards are scored as a normal distribution — they're a sum over ~35 attempts, so they
     come out symmetric. Rushing and receiving yards use a <b>lognormal</b>, because they're
     right-skewed: a couple of long plays pull the mean above the median, so the typical game lands
     <i>below</i> the projection. Treating them as normal would inflate every OVER, which is the
     most common way a homemade prop model loses money. Receptions use Poisson, since it's a small
     count rather than a continuous quantity.</p>

  <h4>Model trust</h4>
  <p>The market prices these props with information the model doesn't have. So the model's
     probability is blended toward the market's, weighted by the sample it stands on:
     <code>trust x n/(n+K)</code>, where n is this season's opportunities and K is how many it takes
     for the model's own rates to settle: 250 pass attempts, 110 carries, 50 targets.</p>
  <p>A receiver with 15 targets in Week 3 carries about 12% weight at trust 50. The same receiver with
     100 targets in December carries about 33%. That's deliberate: the board should be quiet early in
     the season and more assertive once the data has earned it. If it prints dozens of edges in
     Week 3, something is broken. Last season's numbers never count as evidence here — they're
     already inside the prior.</p>
  <p>Trust at 0 reproduces the market exactly. At 100 the model still gets shrunk by sample size,
     just without the extra haircut. 50 is a reasonable default.</p>

  <h4>Calibration</h4>
  <p>Within each market the model should sit close to the market on average. The market is not
     systematically wrong in one direction, so if the model averages well above or below fair value
     across a market's props, that is one bias appearing many times rather than many separate edges.
     It's checked <b>per market</b> — pooled across the slate, a pass-yards under lean can cancel
     against rec-yards overs and hide both. Any market leaning more than 5 points gets a warning and
     every edge in it is flagged. Markets with under 8 props aren't judged.</p>

  <h4>Quarantine</h4>
  <p>Anything the model rates above 90% or below 10% is pulled off the board entirely. Against a
     real market those don't exist — they mean a role changed, a name matched the wrong player, or
     the book posted an unusual rung. The count is shown so you know they happened, but they are
     never ranked as plays.</p>

  <h4>Empty is a real answer</h4>
  <p>If nothing clears the EV threshold, the board says so rather than showing you the least-bad
     six options. A flat week is information.</p>

  <h4>Injuries and usage</h4>
  <p>Each team's skill players share one pool of carries and one of targets. Anyone listed
     <b>Out or Doubtful</b>, or not active on the weekly roster (IR, released, exempt), is removed and
     his share goes to active teammates in proportion to their own roles, weighted toward his
     position. If the room still adds up to more than the team has, every share is scaled down to
     fit. Questionable players are modeled as playing and flagged. A player priced this week with
     no games yet this season is treated as returning and uses his ${PRIOR_SEASON} role.</p>
  <p>Players with no ${PRIOR_SEASON} history shrink toward a role prior set by their snap share
     (fitted on ${PRIOR_SEASON}: RB carry share ≈ 0.95 × snap share), not a position average.</p>

  <h4>Game page</h4>
  <p>Tap any game on the Slate tab. The projection table sits on top; weather is one line; matchup
     charts, notable injuries and the game's props open on demand and stay the way you left them.
     Charts put each offense against what the opposing defense allows — faded ${PRIOR_SEASON} behind
     bright ${SEASON}, dashed league average. Tap a point for the week and opponent. None of this moves
     the projections; it's context for reading them.</p>

  <h4>Badges</h4>
  <p>Silence means the data is clean.
     <code>N opp</code> fewer than 8 opportunities behind the projection ·
     <code>1 game</code> one game this season ·
     <code>role</code> snap share moved more than 15 points ·
     <code>⚠ questionable</code> on the report, modeled as playing ·
     <code>returning</code> no games this season, using last year's role ·
     <code>short game</code> a game in the window at under half his usual snaps — his rates are understated ·
     <code>+N% vacated</code> inherits share from an injured teammate ·
     <code>script</code> spread of 7+ ·
     <code>o-line</code> starting linemen on the report ·
     <code>check inputs</code> edge too large to be credible ·
     <code>1-sided</code> only one price quoted, fair number still has vig ·
     <code>lines vary</code> books disagree on the line ·
     <code>… lean</code> this market is miscalibrated this week.</p>

  <h4>Market anchor</h4>
  <p>How much team-point projections lean on Vegas versus the rate model. Floor is 40% —
     NFL sides and totals are the sharpest markets in sports.</p>

  <h4>Shrinkage</h4>
  <p>Player rates blend the selected window toward ${PRIOR_SEASON}, then toward a position baseline,
     weighted <code>n/(n+k)</code> where n is <b>opportunities</b>, not games. A back with 20 carries
     over two games has a steadier YPC than one with 6, and now gets more weight. Shares shrink on the
     team's opportunities in his games (k≈100 team targets), efficiency on his own
     (YPC k=110 carries, YPT k=50 targets, YPA k=250 attempts). Efficiency is shrunk hardest because
     it stabilizes slowest.</p>

  <h4>Record</h4>
  <p>Each <b>↓ Pull odds</b> logs every edge on the board, across all markets, at your current slider settings.
     A play keeps the price and model numbers from the first time it appeared. Later pulls before kickoff update
     its <b>close</b>. Each morning the nightly build grades finished games from nflverse: win, loss, push
     (landed on the line) or void (didn't play). Units are 1u flat at the logged price.</p>
  <p><b>CLV</b> is the fair probability of your side at the close minus when it was logged, at the same line.
     Positive means the market moved your way. When books moved off the line entirely, "beat the close"
     goes by which way the line moved. Tap <b>☆ I bet this</b> in an edge's panel to track your own bets separately.</p>

  <h4>Credits</h4>
  <p>Only the Pull odds button spends them, about 4 per game. Results cache on the worker for an
     hour and are shared across your devices.</p>
  <div style="margin-top:14px"><button class="btn" onclick="closeModal()">Close</button></div>`);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    const layered = $('detail').classList.contains('open') || $('modal').classList.contains('open');
    closeDetail(); closeModal();
    if (!layered && S.game) leaveGame();
  }
  if (!S.game && !$('detail').classList.contains('open') && !$('modal').classList.contains('open')){
    if (e.key === 'ArrowLeft') $('wPrev').click();
    if (e.key === 'ArrowRight') $('wNext').click();
  }
});

{ const m = location.hash.match(/^#game\/(.+)$/); if (m) S.game = decodeURIComponent(m[1]); }
load();
</script>
