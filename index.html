<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>NFL Slate</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--bg2:#1c1c1e;--bg3:#2c2c2e;--bg4:#3a3a3c;--bg5:#48484a;
  --b1:#3a3a3c;--b2:#48484a;
  --t:#f5f5f7;--t2:#ebebf5bf;--t3:#ebebf599;
  --g:#ff9f0a;--gd:rgba(255,159,10,.15);
  --r:#ff453a;--rd:rgba(255,69,58,.15);
  --bl:#0a84ff;--bld:rgba(10,132,255,.15);
  --y:#ffd60a;--yd:rgba(255,214,10,.15);
  --gr:#30d158;--grd:rgba(48,209,88,.15);
  --pu:#bf5af2;--pud:rgba(191,90,242,.15);
  --fd:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;
  --fb:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  --fm:'IBM Plex Mono','SF Mono',monospace;
  --r1:8px;--r2:12px;--r3:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font-family:var(--fb);font-size:14px;
     padding-bottom:env(safe-area-inset-bottom)}
button,select,input{font-family:var(--fb);color:var(--t)}

.hdr{position:sticky;top:0;z-index:60;background:rgba(0,0,0,.86);
     backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
     border-bottom:2px solid var(--g);padding:10px 14px 0}
.hdr-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.logo{font-family:var(--fd);font-size:21px;font-weight:800;letter-spacing:-.5px;color:var(--g)}
.logo span{color:var(--t);font-weight:300}
.spacer{flex:1}
.btn{background:var(--bg3);border:1px solid var(--b1);border-radius:var(--r1);
     padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--bg4)}
.btn.on{background:var(--gd);border-color:var(--g);color:var(--g)}
.btn.pull{background:var(--gd);border-color:var(--g);color:var(--g)}
.btn:disabled{opacity:.45;cursor:default}
.wk{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--b1);
    border-radius:var(--r1);padding:3px 4px}
.wk button{background:none;border:none;font-size:15px;padding:2px 8px;cursor:pointer;color:var(--t2);border-radius:6px}
.wk button:hover{background:var(--bg4);color:var(--t)}
.wk .lbl{font-family:var(--fm);font-size:12px;font-weight:600;min-width:62px;text-align:center}

.tabs{display:flex;gap:2px;margin-top:9px}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:8px 14px;
     font-size:13px;font-weight:600;color:var(--t3);cursor:pointer}
.tab.on{color:var(--g);border-bottom-color:var(--g)}

.ctrl{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:9px 14px;
      border-bottom:1px solid var(--b1);background:var(--bg2)}
.sl{display:flex;align-items:center;gap:8px;min-width:190px}
.sl label{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.6px;white-space:nowrap}
input[type=range]{-webkit-appearance:none;flex:1;height:3px;border-radius:2px;background:var(--bg4);outline:none;min-width:70px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
     background:var(--g);cursor:pointer;border:2px solid #000}
.sl .val{font-family:var(--fm);font-size:12px;color:var(--g);min-width:38px;text-align:right}
select{background:var(--bg3);border:1px solid var(--b1);border-radius:var(--r1);padding:5px 8px;font-size:12px;font-weight:600}
.fchips{display:flex;gap:5px;flex-wrap:wrap}
.fchip{background:var(--bg3);border:1px solid var(--b1);border-radius:6px;padding:4px 9px;
       font-size:11px;font-weight:600;color:var(--t3);cursor:pointer}
.fchip.on{background:var(--gd);border-color:var(--g);color:var(--g)}

.status{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:7px 14px;
        font-size:11px;color:var(--t3);border-bottom:1px solid var(--b1)}
.conf-bar{display:inline-block;width:60px;height:4px;border-radius:2px;background:var(--bg4);overflow:hidden;vertical-align:middle}
.conf-fill{display:block;height:100%;background:var(--g);border-radius:2px}
.stale{color:var(--y)}

.main{padding:12px 14px 50px;max-width:1400px;margin:0 auto}

/* ---------- edge rows ---------- */
.erow{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--b1);
      border-left:3px solid var(--b2);border-radius:var(--r2);padding:10px 12px;margin-bottom:7px;cursor:pointer}
.erow:hover{border-color:var(--g)}
.erow.over{border-left-color:var(--gr)}
.erow.under{border-left-color:var(--r)}
.e-main{flex:1;min-width:0}
.e-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.e-name{font-family:var(--fd);font-size:15px;font-weight:700;letter-spacing:-.2px}
.e-mkt{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.e-dir{font-family:var(--fm);font-size:12px;font-weight:600;padding:1px 7px;border-radius:5px}
.e-dir.over{background:var(--grd);color:var(--gr)}
.e-dir.under{background:var(--rd);color:var(--r)}
.e-sub{font-family:var(--fm);font-size:11px;color:var(--t2);margin-top:3px}
.e-sub b{color:var(--t)}
.e-num{text-align:right;flex-shrink:0}
.e-ev{font-family:var(--fm);font-size:19px;font-weight:600;line-height:1}
.e-pts{font-family:var(--fm);font-size:10.5px;color:var(--t3);margin-top:3px}
.glink{color:var(--g);cursor:pointer;border-bottom:1px dotted var(--g)}
.glink:hover{color:var(--t)}
.card-go{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--g);white-space:nowrap}
.bdgs{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.bdg{font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--bg4);
     color:var(--t2);letter-spacing:.4px;text-transform:uppercase}
.bdg.warn{background:var(--yd);color:var(--y)}
.bdg.bad{background:var(--rd);color:var(--r)}
.bdg.info{background:var(--bld);color:var(--bl)}

.sechead{font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:var(--t3);
         font-weight:700;margin:20px 0 9px}
.empty{text-align:center;padding:48px 20px;color:var(--t3);font-size:13px;line-height:1.7}
.empty b{color:var(--t2)}

/* ---------- slate cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:11px}
.card{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--r2);padding:12px 13px;cursor:pointer}
.card:hover{border-color:var(--g)}
.c-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:9px}
.matchup{font-family:var(--fd);font-size:16px;font-weight:700;letter-spacing:-.2px;line-height:1.25}
.matchup .at{color:var(--t3);font-weight:400;margin:0 3px}
.kick{font-size:10.5px;color:var(--t3);margin-top:2px;font-family:var(--fm)}
.comp{margin-left:auto;text-align:right}
.comp-v{font-family:var(--fm);font-size:20px;font-weight:600;line-height:1}
.comp-l{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.6px;margin-top:3px}
.lines{display:flex;gap:7px;margin-bottom:9px}
.line{flex:1;background:var(--bg3);border-radius:var(--r1);padding:6px 8px;text-align:center}
.line .k{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.line .v{font-family:var(--fm);font-size:13px;font-weight:600;margin-top:2px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}
.tm{background:var(--bg3);border-radius:var(--r1);padding:7px 9px;border-left:2px solid var(--b2)}
.tm.hot{border-left-color:var(--g)}
.tm-n{font-family:var(--fd);font-size:12px;font-weight:700;margin-bottom:4px;display:flex;justify-content:space-between;align-items:baseline}
.tm-n .pts{font-family:var(--fm);font-size:12px;color:var(--g);font-weight:600}
.tm-r{display:flex;justify-content:space-between;font-size:10.5px;color:var(--t2);font-family:var(--fm);line-height:1.6}
.tm-r span:first-child{color:var(--t3)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:9.5px;font-weight:600;padding:2.5px 7px;border-radius:6px;background:var(--bg4);
      color:var(--t2);text-transform:uppercase;letter-spacing:.4px}
.chip.w{background:var(--bld);color:var(--bl)}
.chip.d{background:var(--yd);color:var(--y)}
.chip.a{background:var(--rd);color:var(--r)}
.chip.g{background:var(--grd);color:var(--gr)}
.chip.o{background:var(--gd);color:var(--g)}

/* ---------- panels ---------- */
.detail{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);
        display:none;align-items:flex-end;justify-content:center}
.detail.open{display:flex}
.dpanel{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--r3) var(--r3) 0 0;
        width:100%;max-width:760px;max-height:92vh;overflow-y:auto;padding:16px 16px 44px}
@media(min-width:720px){.detail{align-items:center}.dpanel{border-radius:var(--r3);max-height:86vh}}
.dhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;position:sticky;top:-16px;
       background:var(--bg2);padding:4px 0 10px;border-bottom:1px solid var(--b1)}
.dhead h2{font-family:var(--fd);font-size:18px;margin:0;font-weight:700;letter-spacing:-.3px}
.sec{margin-bottom:16px}
.sec h3{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin:0 0 8px;font-weight:700}
table{width:100%;border-collapse:collapse;font-family:var(--fm);font-size:11.5px}
th{text-align:right;font-weight:600;color:var(--t3);padding:5px 6px;border-bottom:1px solid var(--b1);font-size:10px}
th:first-child,td:first-child{text-align:left}
td{padding:5px 6px;border-bottom:1px solid rgba(58,58,60,.5);color:var(--t2);text-align:right}
td.hl{color:var(--g);font-weight:600}
.note{font-size:11.5px;color:var(--t3);line-height:1.6;font-family:var(--fb)}
.warn{background:var(--rd);border:1px solid var(--r);border-radius:var(--r1);padding:9px 11px;
      font-size:11.5px;color:var(--t2);line-height:1.5}
.warn b{color:var(--r)}
.modal{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);
       display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.mpanel{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--r3);
        max-width:620px;width:100%;max-height:84vh;overflow-y:auto;padding:18px}
.mpanel h2{font-family:var(--fd);font-size:18px;margin:0 0 4px}
.mpanel h4{font-size:12px;margin:15px 0 5px;color:var(--g);letter-spacing:.3px}
.mpanel p,.mpanel li{font-size:12.5px;color:var(--t2);line-height:1.6;margin:5px 0}
.mpanel code{font-family:var(--fm);font-size:11px;background:var(--bg3);padding:1px 5px;border-radius:4px;color:var(--g)}
.inp{width:100%;background:var(--bg3);border:1px solid var(--b1);border-radius:var(--r1);
     padding:8px 10px;font-family:var(--fm);font-size:12px;margin-top:6px}
textarea.inp{height:300px;resize:vertical;line-height:1.55}
.gpage{max-width:920px;margin:0 auto}
.gback{background:none;border:none;color:var(--g);font-size:14px;font-weight:600;cursor:pointer;padding:4px 0;margin-bottom:8px}
.ghead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.ghead h1{font-family:var(--fd);font-size:28px;font-weight:800;letter-spacing:-.6px;margin:0}
.ghead h1 .at{color:var(--t3);font-weight:400;margin:0 4px}
.gsub{font-family:var(--fm);font-size:12px;color:var(--t2);margin-top:3px}
.gbox{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--r2);padding:12px 13px;margin-bottom:10px}
.wxline{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-family:var(--fm);font-size:12.5px}
.wxline.hit{border-color:var(--bl)}
details.gx{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--r2);margin-bottom:10px}
details.gx>summary{list-style:none;cursor:pointer;padding:12px 13px;display:flex;align-items:center;gap:8px;
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t2)}
details.gx>summary::-webkit-details-marker{display:none}
details.gx>summary .sm{text-transform:none;letter-spacing:0;font-weight:500;color:var(--t3);font-size:12px}
details.gx>summary .cv{margin-left:auto;color:var(--t3);transition:transform .15s}
details.gx[open]>summary .cv{transform:rotate(90deg)}
.gxb{padding:0 13px 13px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.mc{background:var(--bg3);border-radius:var(--r1);padding:9px 10px 7px}
.mc-h{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:3px}
.mc-f{display:flex;justify-content:space-between;font-family:var(--fm);font-size:10.5px;color:var(--t2);margin-top:2px}
.mc-r{font-family:var(--fm);font-size:10.5px;color:var(--t3);min-height:14px;margin-top:2px}
.mc svg circle{cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--t2);margin-bottom:9px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.irow,.prow{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(58,58,60,.5);font-size:12.5px}
.irow:last-child,.prow:last-child{border-bottom:none}
.prow{cursor:pointer}.prow:hover{background:var(--bg3)}
.st{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:5px;letter-spacing:.4px;min-width:26px;text-align:center}
.st.out{background:var(--rd);color:var(--r)}.st.q{background:var(--yd);color:var(--y)}
.st.dnp{background:rgba(255,159,10,.14);color:var(--g)}.st.lp{background:var(--bg2);color:var(--t2);border:1px solid var(--b1)}
.st.rest{background:var(--bg2);color:var(--t3);border:1px solid var(--b1)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--bg4);
      border-top-color:var(--g);border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}

/* ---------- record ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.tile{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--r2);padding:11px 12px}
.tile .tl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--t3)}
.tile .tv{font-family:var(--fm);font-size:21px;font-weight:600;margin-top:5px;line-height:1.1}
.tile .ts{font-family:var(--fm);font-size:10.5px;color:var(--t2);margin-top:4px}
.rtbl{width:100%;border-collapse:collapse;font-family:var(--fm);font-size:11.5px}
.rtbl th{font-family:var(--fb);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
         color:var(--t3);text-align:right;padding:6px 8px;border-bottom:1px solid var(--b1)}
.rtbl td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--bg3);white-space:nowrap}
.rtbl th:first-child,.rtbl td:first-child{text-align:left}
.rtbl td.nm{font-family:var(--fb);font-weight:600;white-space:normal}
.rwrap{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--r2);overflow-x:auto}
.res{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:5px;letter-spacing:.4px;text-transform:uppercase}
.res.win{background:var(--grd);color:var(--gr)}.res.loss{background:var(--rd);color:var(--r)}
.res.push,.res.void{background:var(--bg4);color:var(--t2)}.res.pending{background:var(--bg3);color:var(--t3)}
.betbtn.on{background:var(--gd);border-color:var(--g);color:var(--g)}
.star{color:var(--g)}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <div class="logo">NFL <span>Slate</span></div><span style="font-family:var(--fm);font-size:9px;color:var(--t3);align-self:flex-end;padding-bottom:3px">v2.19</span>
    <div class="wk"><button id="wPrev">‹</button><div class="lbl" id="wLbl">Week —</div><button id="wNext">›</button></div>
    <div class="spacer"></div>
    <button class="btn pull" id="bPull">↓ Pull odds</button>
    <button class="btn" id="bRun">⧉</button>
    <button class="btn" id="bSet">⚙</button>
    <button class="btn" id="bGuide">?</button>
    <button class="btn" id="bRefresh">↺</button>
  </div>
  <div class="tabs">
    <button class="tab on" data-tab="edges">Edges</button>
    <button class="tab" data-tab="slate">Slate</button>
    <button class="tab" data-tab="record">Record</button>
  </div>
</div>

<div class="ctrl" id="ctrlEdges">
  <div class="sl"><label>Min EV</label><input type="range" id="minev" min="0" max="15" value="2" step="0.5"><div class="val" id="minevV">+2.0%</div></div>
  <div class="sl"><label>Market anchor</label><input type="range" id="anchor" min="40" max="100" value="75" step="5"><div class="val" id="anchorV">75%</div></div>
  <div class="sl"><label>O-line impact</label><input type="range" id="oline" min="0" max="15" value="6" step="1"><div class="val" id="olineV">6%</div></div>
  <div class="sl"><label>Model trust</label><input type="range" id="trust" min="0" max="100" value="50" step="5"><div class="val" id="trustV">50%</div></div>
  <select id="lastn">
    <option value="3">Last 3</option><option value="5" selected>Last 5</option>
    <option value="8">Last 8</option><option value="99">Season</option>
  </select>
  <div class="fchips" id="mktChips"></div>
</div>

<div class="ctrl" id="ctrlSlate" style="display:none">
  <div class="sl"><label>Market anchor</label><input type="range" id="anchor2" min="40" max="100" value="75" step="5"><div class="val" id="anchorV2">75%</div></div>
  <select id="sort">
    <option value="time">Sort: Kickoff</option><option value="edges">Sort: Edges</option>
    <option value="inj">Sort: Injuries</option><option value="total">Sort: Total</option>
  </select>
</div>

<div class="status" id="status"><span class="spin"></span> loading…</div>
<div class="main" id="main"></div>

<div class="detail" id="detail"><div class="dpanel" id="dpanel"></div></div>
<div class="modal" id="modal"><div class="mpanel" id="mpanel"></div></div>

<script>
/* ===================================================================== */
const DEFAULT_WORKER = 'https://nfl-data.billywitchdoctordfs.workers.dev';
/* Defaults only — data/meta.json (written by the nightly build) sets the real seasons,
   so next year rolls over without editing this file. */
let SEASON = 2026, PRIOR_SEASON = 2025, META = null;

const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
let WORKER = store.get('nflslate.worker', DEFAULT_WORKER);

/* Shrinkage is counted in OPPORTUNITIES, not games: k is how many attempts /
   carries / targets it takes before this season outweighs the prior. Values are
   the old game-based k converted at league-average volume, so a typical team or
   player lands where it did before — high-volume ones now stabilize faster,
   low-volume ones slower. Per-game rates (plays, points) stay in games.
   `n` returns the opportunity count behind a rate; the fallbacks cover a worker
   response that predates the raw totals. */
const tot = (r, total, perGame) => (r[total] !== undefined && r[total] !== null)
  ? r[total] : (r[perGame] || 0) * (r.games || 0);

const K = {
  plays_pg:  { k:3,   n:r => r.games || 0 },
  points_pg: { k:6,   n:r => r.games || 0 },
  pass_rate: { k:185, n:r => tot(r,'plays','plays_pg') },          // plays
  sack_rate: { k:180, n:r => tot(r,'dropbacks','dropbacks_pg') },  // dropbacks
  adot:      { k:165, n:r => tot(r,'attempts','attempts_pg') },    // attempts
  ypa:       { k:265, n:r => tot(r,'attempts','attempts_pg') },    // attempts

/* ===================================================================== */
/* PROBABILITY                                                            */
/* ===================================================================== */
function normCDF(z){
  // Abramowitz & Stegun 26.2.17
  const t = 1/(1+0.2316419*Math.abs(z));
  const d = 0.3989422804014327*Math.exp(-z*z/2);
  let p = d*t*(0.319381530 + t*(-0.356563782 + t*(1.781477937 + t*(-1.821255978 + t*1.330274429))));
  return z > 0 ? 1-p : p;

function pOverLognormal(mean, sd, line){

  return 1 - normCDF((Math.log(line) - mu)/s);

  const k = Math.floor(line);

/** Dispatch on the market's outcome shape. */
function pOver(mean, sd, line, dist){

  if (dist === 'poisson')   return pOverPoisson(mean, line);

const amToProb = a => a === null||a === undefined ? null : (a > 0 ? 100/(a+100) : -a/(-a+100));
const payout   = a => a > 0 ? a/100 : 100/(-a);

/** Strip the vig: raw implied probabilities are renormalized to sum to 1. */
function devig(over, under){
  const po = amToProb(over), pu = amToProb(under);
  if (po === null || pu === null) return { over:po, under:pu, fair:false };
  const s = po + pu;
  return { over:po/s, under:pu/s, fair:true, hold:+((s-1)*100).toFixed(2) };

/* RATES                                                                  */

function blendPrior(cur, n, prior, k){
  if (prior === null || prior === undefined) return (cur === undefined ? null : cur);
  if (cur === null || cur === undefined || !n) return prior;
  const w = n/(n+k);
  return cur*w + prior*(1-w);

function teamRate(team, side, key){
  const c = S.rates.teams && S.rates.teams[team] ? S.rates.teams[team][side] : null;
  const p = S.prior.teams && S.prior.teams[team] ? S.prior.teams[team][side] : null;
  const lg = (S.prior.league && S.prior.league[key] !== undefined) ? S.prior.league[key] : FALLBACK[key];
  const priorV = (p && p[key] !== null && p[key] !== undefined) ? p[key] : lg;
  const spec = K[key] || { k:5, n:r => r.games || 0 };

const normName = s => (s||'').toLowerCase().replace(/[.'`\-]/g,' ')

/** A stat line's value for `key`. att_share falls back to att_pg / team attempts_pg

function statVal(st, key, team, rates){
  if (!st) return null;
  const v = st[key];
  if (v !== null && v !== undefined) return v;
  if (key === 'att_share' && st.att_pg) {
    const t = rates && rates.teams && rates.teams[team] && rates.teams[team].offense;
    if (t && t.attempts_pg) return clamp(st.att_pg / t.attempts_pg, 0, 1);

const SHARE_KEYS = { carry_share:1, target_share:1 };

/** Blended player rate: this season's window → last season → position default.
    Both blends are weighted by opportunities (see PK), not games.

    the number is evidence rather than prior. The usage book uses it to decide who
    absorbs a budget cut. */
function playerRateW(name, pos, key){
  const ix = playerIndex();
  const n = normName(name);
  const c = ix.cur.get(n), pr = ix.prior.get(n);
  const win = S.lastn >= 99 ? 'season' : 'last';
  const spec = PK[key] || { k:5, n:s => s.games || 0 };
  const cs = c && c[win] ? c[win] : null, ps = pr && pr.season ? pr.season : null;
  const cv = statVal(cs, key, c && c.team, S.rates);
  let pv = statVal(ps, key, pr && pr.team, S.prior);

  /* Role change. Last year's share only carries over if the role did: scale it by
     this season's snap share over last season's. A back who went from 55% of snaps
     to 3% doesn't keep a 40% carry-share prior. */
  if (SHARE_KEYS[key] && pv !== null && pv !== undefined && pos !== 'QB') {
    // Max recent snap share, not the average: one game he left early (Barkley, 16% in
    // Week 2 after 71%) isn't a demotion. A real one (3% and 2%) still shows.

function marketImplied(g){

  return { home:g.total/2 + g.spread/2, away:g.total/2 - g.spread/2 };
}

  const o = teamRate(team,'offense','points_pg');

  if (o === null) return d; if (d === null) return o;

  const w = (S.wx[g.game_id] && S.wx[g.game_id].wind !== undefined) ? S.wx[g.game_id].wind : g.wind;
  if (w === null || w === undefined) return { mult:1, wind:null, indoor:false };

    const oR = teamRate(team,'offense','pass_rate');
    const dR = teamRate(opp,'defense','pass_rate');
    let pr = (oR !== null && dR !== null) ? oR*0.7 + dR*0.3 : (oR !== null ? oR : (dR !== null ? dR : FALLBACK.pass_rate));

       played, so only adjust for the margin BEYOND its usual one, and gently:
       ~0.4 pt of pass rate per point of excess margin. */
    const margin = (myPts !== null && oppPts !== null) ? myPts-oppPts : 0;
    const pf = teamRate(team,'offense','points_pg'), pa = teamRate(team,'defense','points_pg');
    const usual = (pf !== null && pa !== null) ? pf - pa : 0;

    const dYpa = teamRate(opp,'defense','ypa') || FALLBACK.ypa;

    const ro = S.roster.byName.get(n);

    if (INACTIVE[ro.status]) return { active:false, why:INACTIVE[ro.status] };

    if (p.team === team && SKILL_POS.test(p.pos))
      members.set(normName(p.name), { name:p.name, pos:p.pos, returning:false });

  // a starter back from injury. Without him in the room, his teammates keep his share.
  for (const pr of S.props) {
    const n = normName(pr.player);
    if (members.has(n) || ix.cur.has(n)) continue;
    const prev = ix.prior.get(n);

    const act = rows.filter(r => r.active && pool(r)), gone = rows.filter(r => !r.active && pool(r));
    for (const r of act) r.final[k] = r.raw[k];

      if (g.raw[k] < 0.005) continue;
      const w = act.map(r => r.raw[k] * (r.pos === g.pos ? 3 : 1)), W = w.reduce((a,b) => a+b, 0);

         (a backup projected at 20% on zero carries). A starter projected at what
         he's doing loses nothing here. The gap is discounted by how much real history

         snap-based guess with no history is. Players with no games this window

      let excess = sum - budget;

      scale = budget / sum;
      for (const r of act) { r.final[k] *= scale; for (const x of r.gain[k]) x.add *= scale; }
    }
    for (const r of gone) r.final[k] = 0;
    return { sum, budget, scale, vacated, trimmed: sum > budget };
  };

  /* QB rooms aren't committees: one man takes the snaps. Books only post passing
     yards for the expected starter, so a priced QB IS the starter — 97% of attempts,
     whatever split the last two games (or last year's backup role) suggest. */
  const priced = new Set(S.props.filter(p => p.market === 'player_pass_yds').map(p => normName(p.player)));
  const starters = rows.filter(r => r.active && r.pos === 'QB' && priced.has(r.key));
  const starter = starters.length === 1 ? starters[0] : null;
  if (starter) starter.starter = true;

  // QB scrambles come out of the carry budget; the starter's rushing share sets it.
  const qbCarry = starter ? starter.raw.carry_share
    : rows.filter(r => r.active && r.pos === 'QB').reduce((m, r) => Math.max(m, r.raw.carry_share), 0);
  const alloc = {
    carry_share:  allocate('carry_share',  r => r.pos !== 'QB', clamp(1 - qbCarry, 0.75, 0.98), false),
    target_share: allocate('target_share', r => r.pos !== 'QB', 1.0, false),
    // No priced starter: somebody throws every pass, so QB shares scale up as well as down.
    att_share:    starter ? { sum:0.97, budget:0.97, scale:1, vacated:0, trimmed:false, starter:starter.name }
                          : allocate('att_share', r => r.pos === 'QB', 0.97, true),
  };
  if (starter) for (const r of rows) if (r.pos === 'QB') { r.final.att_share = r === starter ? 0.97 : 0; r.gain.att_share = []; }
  for (const r of rows) if (r.pos === 'QB') r.final.carry_share = r.active ? r.raw.carry_share : 0;

  const book = { team, rows, byKey, alloc,
                 removed: rows.filter(r => !r.active && (r.raw.carry_share + r.raw.target_share + r.raw.att_share) > 0.01) };
  _books.set(team, book);
  return book;
}

function projectProp(pr, g, proj){
  const meta = playerMeta(pr.player);
  if (!meta) return null;
  const team = currentTeam(pr.player, meta);
  if (team !== g.home && team !== g.away) return null;
  const side = teamSide(proj, g, team);
  const pos = meta.pos;
  const def = MKT[pr.market];
  if (!def) return null;

  const book = usageBook(team), me = book.byKey.get(normName(pr.player));
  if (me && !me.active) return null;              // ruled out / inactive: nothing to project
  const shareOf = k => me ? me.final[k] : playerRate(pr.player, pos, k);
  const usage = k => me ? { key:k, me, book } : null;

  let mean = null, parts = {}, used = null;
  if (pr.market === 'player_pass_yds') {
    if (pos !== 'QB') return null;
    const share = clamp(shareOf('att_share') || 0.97, 0, 1);
    used = usage('att_share');
    const ypa = playerRate(pr.player,pos,'ypa') || side.ypa;
    // player's own YPA, tempered by the matchup-adjusted team number
    const useYpa = (ypa*0.6 + side.ypa*0.4);
    mean = side.att * share * useYpa;
    parts = { att:side.att*share, ypa:useYpa, share };
  }
  else if (pr.market === 'player_rush_yds') {
    const cs = shareOf('carry_share');
    if (!cs) return null;
    used = usage('carry_share');
    const ypc = playerRate(pr.player,pos,'ypc') || side.ypc;
    const useYpc = (ypc*0.55 + side.ypc*0.45);
    mean = side.carries * cs * useYpc;
    parts = { carries:side.carries*cs, ypc:useYpc, share:cs };
  }
  else if (pr.market === 'player_reception_yds' || pr.market === 'player_receptions') {
    const ts = shareOf('target_share');
    if (!ts) return null;
    used = usage('target_share');
    const tgts = side.att * ts;
    if (pr.market === 'player_receptions') {
      const cr = playerRate(pr.player,pos,'catch_rate') || 0.65;
      mean = tgts*cr; parts = { targets:tgts, catch_rate:cr, share:ts };
    } else {
      const ypt = playerRate(pr.player,pos,'ypt') || 8.0;
      // O-line pressure compresses aDOT: receivers lose, backs gain slightly
      const olAdj = pos === 'RB' ? (1 + side.ol.sev*0.06) : side.ol.mult;
      mean = tgts*ypt*olAdj; parts = { targets:tgts, ypt, share:ts, olAdj };
    }
  }
  if (mean === null || !isFinite(mean) || mean <= 0) return null;
  return { mean, sd:def.sd(mean), dist:def.dist, parts, meta, side, pos, team, usage:used };
}

function buildEdges(){
  _books = new Map();
  if (!S.props.length) return { priced:[], unpriced:[] };
  const byGame = new Map();
  for (const g of S.games) { byGame.set(g.away+'@'+g.home, g); }

  const out = [];
  for (const pr of S.props) {
    if (!S.mktFilter.has(pr.market)) continue;
    const g = byGame.get(pr.game);
    if (!g) continue;
    const proj = project(g);
    const pj = projectProp(pr, g, proj);
    if (!pj) continue;

    const pRaw = pOver(pj.mean, pj.sd, pr.line, pj.dist);
    const dv = devig(pr.over, pr.under);
    if (dv.over === null && dv.under === null) continue;

    /* The market prices these with information the model doesn't have. Weight the
       model by the sample it's standing on: w = trust x n/(n+K) in this season's opportunities,
       K per market (TRUST_K). Early in the year the model barely moves the number.
       This is why the board is quiet in September and louder in December. */
    // Trust is earned by THIS season's opportunities only. A returning player's
    // 2025 targets are already inside his prior; counting them again as evidence
    // gave a no-games-yet player 40% trust.
    const curMeta = playerIndex().cur.get(normName(pr.player));
    const opp = curMeta ? oppCount(pr.market, curMeta) : 0;
    const w = (S.trust/100) * (opp/(opp + trustK(pr.market)));
    const pFairOver = dv.over !== null ? dv.over : 1 - dv.under;
    const pModelOver = w*pRaw + (1-w)*pFairOver;

    const lowVol = pj.mean < (MIN_VOL[pr.market] || 0);

    // evaluate both sides, keep the better one
    const cands = [];
    if (pr.over !== null && dv.over !== null)
      cands.push({ dir:'over', p:pModelOver, fair:dv.over, price:pr.over, book:pr.over_book });
    if (pr.under !== null && dv.under !== null)
      cands.push({ dir:'under', p:1-pModelOver, fair:dv.under, price:pr.under, book:pr.under_book });
    if (!cands.length) continue;
    for (const c of cands) { c.ev = evPct(c.p, c.price); c.pts = (c.p - c.fair)*100; }
    cands.sort((a,b) => b.ev - a.ev);
    const best = cands[0];

    out.push({
      prop:pr, game:g, proj, pj, best, fair:dv, pOverModel:pModelOver,
      pRaw, opp, w, lowVol,
      badges: edgeBadges(pr, g, pj, best, dv),
    });
  }
  // A model that says 95% against a real market is reporting a broken input,
  // not an edge. Quarantine these instead of ranking them first.
  /* Judged on the RAW model probability: trust-weighting would otherwise launder a
     94% raw call into a tidy-looking 62% and let it onto the board. */
  const rawSide = e => e.best.dir === 'over' ? e.pRaw : 1 - e.pRaw;
  const suspect = out.filter(e => rawSide(e) > 0.90 || rawSide(e) < 0.10 || Math.abs(e.best.pts) > 20);
  const lowvol = out.filter(e => e.lowVol && suspect.indexOf(e) < 0);
  const clean = out.filter(e => suspect.indexOf(e) < 0 && lowvol.indexOf(e) < 0);
  const priced = clean.filter(e => e.best.ev >= S.minev).sort((a,b) => b.best.ev - a.best.ev);

  const cal = calibrate(clean, priced);
  if (cal) for (const e of priced) {
    const m = cal.byMarket[e.prop.market];
    if (m && m.bad) e.badges.push(['bad', MKT[e.prop.market].label + ' lean']);
  }
  return { priced, all:clean, suspect, lowvol, cal };
}

/* Calibration, PER MARKET. Within one market the model should land close to the
   market on average — it isn't systematically wrong in one direction. A mean model
   P(over) well away from mean fair P(over) is one bias repeated, not many edges.
   Slate-wide pooling let a -12 pass-yds lean cancel against overs elsewhere.
   `bias` is the blended probability (what drives the board); `raw` is the
   unshrunk projection, which shows the underlying miss even when trust hides it. */
const CAL_MIN = 8, CAL_WARN = 5;
function calibrate(clean, priced){
  const groups = {};
  for (const e of clean) {
    if (!e.fair.fair || e.fair.over === null) continue;
    (groups[e.prop.market] = groups[e.prop.market] || []).push(e);
  }
  const avg = (xs, f) => xs.reduce((s,x) => s + f(x), 0) / xs.length;
  const rows = [], byMarket = {};
  for (const m of Object.keys(MKT)) {
    const xs = groups[m]; if (!xs || !xs.length) continue;
    const fair = avg(xs, e => e.fair.over);
    const model = avg(xs, e => e.pOverModel);
    const raw = avg(xs, e => e.pRaw);
    const pm = priced.filter(e => e.prop.market === m);
    const enough = xs.length >= CAL_MIN;
    const bias = (model - fair) * 100;
    const spread = avg(xs, e => Math.abs(e.pRaw - e.fair.over)) * 100;
    const row = { market:m, n:xs.length, fair, model, bias, raw:(raw - fair)*100, spread, enough,
                  bad: enough && Math.abs(bias) > CAL_WARN, priced:pm.length,
                  overShare: pm.length ? pm.filter(e => e.best.dir === 'over').length / pm.length : null };
    rows.push(row); byMarket[m] = row;
  }
  return rows.length ? { rows, byMarket, bad:rows.filter(r => r.bad) } : null;
}

function calHtml(cal){
  if (!cal) return '';
  const sg = v => (v > 0 ? '+' : '') + R(v,1);
  const tr = r => `<tr style="${r.enough?'':'opacity:.5'}">
      <td>${MKT[r.market].label}${r.bad?' <span style="color:var(--r)">⚠</span>':''}</td>
      <td>${r.n}</td><td>${Math.round(r.model*100)}%</td><td>${Math.round(r.fair*100)}%</td>
      <td class="${r.bad?'':'hl'}" style="${r.bad?'color:var(--r);font-weight:600':''}">${r.enough?sg(r.bias):'—'}</td>
      <td>${sg(r.raw)}</td><td>${R(r.spread,1)}</td>
      <td>${r.overShare===null?'—':Math.round(r.overShare*100)+'% of '+r.priced}</td></tr>`;
  const bad = cal.bad;
  const msg = bad.length
    ? `<b>${bad.map(r => MKT[r.market].label).join(', ')} ${bad.length===1?'leans':'lean'} far enough to be model bias.</b>
       Every edge in ${bad.length===1?'that market':'those markets'} is flagged — treat them as untrustworthy until the lean is near zero.
       Other markets are judged on their own.`
    : `Every market with ${CAL_MIN}+ props is within ±${CAL_WARN} points — the board is worth reading.`;
  return `<div class="${bad.length?'warn':'note'}" style="margin-bottom:12px">
    <b>Calibration by market</b> — mean model P(over) vs devigged fair, per market.
    <div style="overflow-x:auto;margin:6px 0"><table>
      <tr><th>market</th><th>n</th><th>model</th><th>fair</th><th>lean</th><th>raw</th><th>spread</th><th>overs</th></tr>
      ${cal.rows.map(tr).join('')}</table></div>
    ${msg}
    <div style="margin-top:4px;opacity:.8">Lean is after trust-weighting; raw is the unshrunk projection's
      lean. Spread is the average raw distance from fair in either direction — lean can sit at
      zero while overs and unders cancel; spread can't. Greyed rows have under ${CAL_MIN} props.</div></div>`;
}

function edgeBadges(pr, g, pj, best, dv){
  const b = [];
  const m = pj.meta;
  // Sample size that matters is opportunities, not games played.
  const w = S.lastn >= 99 ? 'season' : 'last';
  const st = m[w] || m.season;
  const cm = playerIndex().cur.get(normName(pr.player));
  const opp = cm ? oppCount(pr.market, cm) : 0;
  if (opp < 8) b.push(['warn', `${Math.round(opp)} opp`]);
  if ((m.weeks_played || 0) < 2) b.push(['warn','1 game']);
  if (m.snap_drift !== null && Math.abs(m.snap_drift) > 0.15) b.push(['warn','role']);
  if (st && st.short_games) b.push(['warn','short game']);
  const u = pj.usage;
  if (u && u.me.questionable) b.push(['bad','⚠ questionable']);
  if (u && u.me.returning) b.push(['warn','returning']);
  const got = u ? u.me.gain[u.key].reduce((a,x) => a + x.add, 0) : 0;
  if (got >= 0.02) b.push(['info', `+${(got*100).toFixed(0)}% vacated`]);
  if (Math.abs(g.spread||0) >= 7) b.push(['info','script']);
  if (pj.side.ol.sev >= 0.3) b.push(['warn','o-line']);
  if (Math.abs(best.pts) > 12) b.push(['bad','check inputs']);
  if (!dv.fair) b.push(['warn','1-sided']);
  if (pr.line_spread >= 2) b.push(['info','lines vary '+pr.line_spread]);
  return b;
}

function confidence(g){
  const t = [g.home,g.away]; let have=0, need=0;
  for (const tm of t){
    need += 2;
    if (S.prior.teams && S.prior.teams[tm] && S.prior.teams[tm].offense) have++;
    if (S.prior.teams && S.prior.teams[tm] && S.prior.teams[tm].defense) have++;
  }
  const curN = (S.rates.teams && S.rates.teams[g.home] && S.rates.teams[g.home].offense)
             ? S.rates.teams[g.home].offense.games : 0;
  return clamp((need?have/need:0)*0.65 + clamp(curN/8,0,1)*0.35, 0, 1);
}


/* ===================================================================== */
/* WHY — drivers behind a projection, split by what the model actually    */
/* uses versus context it does not yet model.                             */
/* ===================================================================== */
const DEF_POS = /^(CB|S|FS|SS|DB|LB|ILB|OLB|MLB|DE|DT|NT|EDGE)$/;
const SKILL_POS = /^(QB|RB|WR|TE|FB)$/;

function whyFactors(e){
  const { prop:pr, game:g, proj, pj } = e;
  const side = pj.side, opp = side.opp;
  const lg = S.prior.league || {};
  const used = [], context = [];

  // --- volume
  const lgAtt = lg.attempts_pg || 33;
  const dAtt = side.att - lgAtt;
  if (Math.abs(dAtt) >= 1.5)
    used.push([dAtt > 0 ? 'up' : 'down',
      `${side.team} projected ${R(side.att,1)} pass attempts, ${R(Math.abs(dAtt),1)} ${dAtt>0?'above':'below'} league average`]);

  // --- share: his own, what he inherits, and the room cap
  const pct = v => (v*100).toFixed(1) + '%';
  const u = pj.usage;
  if (u) {
    const k = u.key, lbl = k === 'carry_share' ? 'carry' : k === 'att_share' ? 'pass-attempt' : 'target';
    used.push(['flat', `${pct(u.me.raw[k])} ${lbl} share from his own usage`
      + (u.me.returning ? ` — no games this season, so this is his ${PRIOR_SEASON} role` : '')]);
    for (const x of u.me.gain[k])
      used.push(['up', `+${pct(x.add)} ${lbl} share from ${x.pos} ${x.from} (${x.why})`]);
    const al = u.book.alloc[k];
    if (al.trimmed) {
      const before = u.me.raw[k] + u.me.gain[k].reduce((a,x) => a + x.add, 0);
      const cut = before - u.me.final[k];
      used.push(['down', `${side.team}'s ${k === 'att_share' ? 'QBs' : 'skill players'} added up to ${pct(al.sum)} of the ${lbl}s against room for ${pct(al.budget)}`
        + (cut >= 0.002 ? ` — trimmed ${pct(cut)} from him. Cuts come first from usage projected above what a player has actually shown this season${u.me.obs[k]!==null?` (his actual: ${pct(u.me.obs[k])})`:''}`
                        : ` — the cut came from teammates projected above their actual usage, not him`)]);
    }
    else if (al.scale > 1.02)
      used.push(['up', `${side.team}'s QBs only covered ${pct(al.sum)} of attempts — scaled up to ${pct(al.budget)}`]);
    if (k === 'att_share' && u.me.starter)
      used.push([u.me.raw[k] < 0.9 ? 'up' : 'flat', `Books priced him as ${side.team}'s passer this week — modeled at 97% of attempts`
        + (u.me.raw[k] < 0.9 ? ` (his share so far: ${pct(u.me.raw[k])})` : '')]);
    else if (Math.abs(u.me.final[k] - u.me.raw[k]) >= 0.001)
      used.push(['flat', `${pct(u.me.final[k])} ${lbl} share used in the projection`]);
  } else if (pj.parts.share !== undefined)
    used.push(['flat', `${pct(pj.parts.share)} ${pr.market==='player_rush_yds'?'carry':'target'} share`]);

  // --- matchup: opponent defense
  const dYpa = teamRate(opp,'defense','ypa'), dYpc = teamRate(opp,'defense','ypc');
  if (pr.market === 'player_rush_yds' && dYpc !== null && lg.ypc){
    const d = dYpc - lg.ypc;
    if (Math.abs(d) >= 0.2) used.push([d>0?'up':'down',
      `${opp} allows ${R(dYpc,2)} yards per carry, ${R(Math.abs(d),2)} ${d>0?'above':'below'} average`]);
  } else if (dYpa !== null && lg.ypa){
    const d = dYpa - lg.ypa;
    if (Math.abs(d) >= 0.2) used.push([d>0?'up':'down',
      `${opp} allows ${R(dYpa,2)} yards per attempt, ${R(Math.abs(d),2)} ${d>0?'above':'below'} average`]);
  }

  // --- script
  const sp = g.spread || 0;
  const favored = (side.team === g.home && sp > 0) || (side.team === g.away && sp < 0);
  if (Math.abs(sp) >= 4)
    used.push([favored ? 'down' : 'up',
      `${side.team} ${favored?'favored':'an underdog'} by ${Math.abs(sp)} — script pushes ${favored?'toward the run':'toward passing'}`]);

  // --- weather
  if (proj.wf.indoor) used.push(['flat','Indoor, no weather adjustment']);
  else if (proj.wf.mult < 1)
    used.push(['down', `${proj.wf.wind} mph wind trims passing efficiency ${Math.round((1-proj.wf.mult)*100)}%`]);

  // --- o-line
  if (side.ol.sev > 0)
    used.push(['down', `${side.team} O-line starters on the report — ${Math.round(side.ol.sev*100)}% severity at your ${S.olineImp}% setting`]);

  /* ---- context the model does NOT currently use ---- */
  const inj = S.injuries.filter(i => /out|doubtful|questionable/i.test(i.status));

  // Out/Doubtful teammates are in the projection now (usage book). Questionable ones
  // are not — they're expected to play — so they stay here as a thing to watch.
  const mates = inj.filter(i => i.team === side.team && SKILL_POS.test(i.position||'')
                           && !OUT_RE.test(i.status || '')
                           && normName(i.name) !== normName(pr.player));
  for (const m of mates.slice(0,5))
    context.push(['flat', `Teammate ${m.position} ${m.name} is questionable${m.injury?' ('+m.injury+')':''} — modeled as playing; if he sits, his usage moves`]);
  const stw = pj.meta[S.lastn >= 99 ? 'season' : 'last'] || pj.meta.season;
  if (stw && stw.short_games)
    context.push(['up', `${stw.short_games} game${stw.short_games>1?'s':''} in this window at under half his best snap share `
      + `(${Math.round((stw.snap_max||0)*100)}%) — likely left early. His usage rates are dragged down by it; the role prior isn't`]);
  if (pj.usage && pj.usage.me.returning)
    context.push(['flat', `No snaps this season yet — the market may know his workload is limited on return`]);

  const dbs = inj.filter(i => i.team === opp && DEF_POS.test(i.position||''));
  for (const d of dbs.slice(0,5))
    context.push([/^(CB|S|FS|SS|DB)$/.test(d.position)?'up':'flat',
      `${opp} ${d.position} ${d.name} is ${d.status.toLowerCase()}${d.injury?' ('+d.injury+')':''}`]);

  const oppOl = S.oline[opp];
  if (oppOl && oppOl.severity > 0)
    context.push(['flat', `${opp} also has O-line starters out — their offense may stall, which changes the script`]);

  if (pr.n_lines > 1)
    context.push(['flat', `Books posted ${pr.n_lines} different lines spanning ${pr.line_spread} — the number you get matters as much as the price`]);

  return { used, context };
}

function whyHtml(e){
  const w = whyFactors(e);
  const arrow = d => d === 'up' ? '<span style="color:var(--gr)">▲</span>'
                   : d === 'down' ? '<span style="color:var(--r)">▼</span>'
                   : '<span style="color:var(--t3)">•</span>';
  const li = x => `<div style="display:flex;gap:8px;margin:5px 0;line-height:1.5">
      <span style="flex-shrink:0">${arrow(x[0])}</span><span>${x[1]}</span></div>`;
  return `<div class="sec"><h3>Why this number</h3>
    <div class="note">${w.used.length ? w.used.map(li).join('')
      : 'Nothing notable — this is a baseline projection.'}</div></div>
    ${w.context.length ? `<div class="sec"><h3>Not in the model — check yourself</h3>
      <div class="note" style="opacity:.92">${w.context.map(li).join('')}</div>
      <div class="note" style="margin-top:7px;color:var(--y)">These do not move the projection above.
        Out/Doubtful teammates are already redistributed; questionable players, opposing-defense
        injuries and coverage matchups are not, so treat these as reasons to look closer, not as part of the edge.</div></div>` : ''}`;
}

/* DATA                                                                   */

async function jget(path){
  const r = await fetch(WORKER.replace(/\/+$/,'') + path);
  if (!r.ok) throw new Error(path.split('?')[0] + ' → ' + r.status);
  return await r.json();
}

/* Heavy tables (player/team rates, roster) are built nightly by a GitHub Action
   into data/ beside this page — parsing a season of stats exceeds a free-tier
   worker's limits. The worker endpoints are only a fallback. */
async function loadMeta(){
  try {
    const r = await fetch('./data/meta.json', { cache:'no-store' });
    if (!r.ok) return;
    META = await r.json();
    if (META.season) { SEASON = META.season; PRIOR_SEASON = META.prior_season || SEASON - 1; }
  } catch(e) {}
}
async function dataFile(name, workerPath){
  if (META && (META.files || []).indexOf(name) >= 0) {
    try {
      const r = await fetch(`./data/${name}?v=${encodeURIComponent(META.generated || '')}`);
      if (r.ok) return await r.json();
    } catch(e) {}
  }
  if (!workerPath) throw new Error(name + ' not built yet — run the nightly workflow');
  return jget(workerPath);
}
/** The nightly file carries every window (players[id].lasts[n]); expose the chosen one as .last. */
function pickWindow(d){
  const n = S.lastn >= 99 ? null : S.lastn;
  for (const p of Object.values(d.players || {}))
    if (p.lasts) p.last = n !== null ? (p.lasts[n] || null) : null;
  return d;
}
/** Nightly roster file holds every week; take the latest published one at or before this week. */
function pickRosterWeek(d){
  if (!d.weeks) return d;
  const wk = Object.keys(d.weeks).map(Number).filter(w => w <= S.week).sort((a,b) => b-a)[0];
  return { week_used: wk || null,
           players: wk ? d.weeks[wk].map(r => ({ name:r[0], team:r[1], pos:r[2], status:r[3] })) : [] };
}

async function loadWeeks(){
  const d = await jget(`/weeks?season=${SEASON}`);
  S.weeks = d.weeks || [];
  if (S.week === null) S.week = d.current || 1;
}

async function loadAll(){
  /* A failed rate fetch must never look like a normal board: every player would
     silently shrink to a position default. Record it and show it in red. */
  S.dataErr = [];
  const soft = (label, p, empty, count) => p.then(d => {
      if (!count(d)) S.dataErr.push(label + ' came back empty');
      return d;
    }).catch(e => { S.dataErr.push(label + ' failed (' + e.message + ')'); return empty; });
  const nTeams = d => Object.keys(d.teams || {}).length, nPlayers = d => Object.keys(d.players || {}).length;
  const always = () => true;
  const [slate, rates, prior, pRates, pPrior, inj, ros] = await Promise.all([
    jget(`/slate?season=${SEASON}&week=${S.week}`),
    soft(`${SEASON} team rates`, dataFile(`team-rates-${SEASON}.json`, `/team-rates?season=${SEASON}`), {teams:{},league:{}}, nTeams),
    soft(`${PRIOR_SEASON} team priors`, dataFile(`team-rates-${PRIOR_SEASON}.json`, `/team-rates?season=${PRIOR_SEASON}`), {teams:{},league:{}}, nTeams),
    soft(`${SEASON} player rates`, dataFile(`player-rates-${SEASON}.json`, `/player-rates?season=${SEASON}&lastn=${S.lastn>=99?10:S.lastn}&v=22`).then(pickWindow), {players:{}}, nPlayers),
    soft(`${PRIOR_SEASON} player priors`, dataFile(`player-rates-${PRIOR_SEASON}.json`, `/player-rates?season=${PRIOR_SEASON}&lastn=5&v=22`), {players:{}}, nPlayers),
    // Injuries can legitimately be empty early in a week; a failed fetch still gets reported.
    soft('injury report', jget(`/injuries?season=${SEASON}&week=${S.week}`), {injuries:[]}, always),
    soft('roster', dataFile(`roster-${SEASON}.json`, `/roster?season=${SEASON}&week=${S.week}`).then(pickRosterWeek), {players:[]}, d => (d.players||[]).length),
  ]);
  S.games = slate.games || []; S.rates = rates; S.prior = prior;
  S.pRates = pRates; S.pPrior = pPrior; _pIndex = null;
  S.injuries = inj.injuries || [];
  setRoster(ros);
  jget(`/oline?season=${SEASON}&week=${S.week}`)
    .then(d => { S.oline = d.teams||{}; render(); }).catch(()=>{});
  jget(`/props/status?week=${S.week}`)
    .then(d => { if (d.cached) loadCachedProps(); else { S.props=[]; S.propsMeta=null; render(); } })
    .catch(()=>{});

  loadWeather();
  loadLogged();
}

function setRoster(d){
  const byName = new Map(), teams = new Set();
  for (const p of (d.players || [])) { byName.set(normName(p.name), p); teams.add(p.team); }
  S.roster = { loaded: byName.size > 0, week:d.week_used || null, byName, teams };
}

/* Reads whatever is already in KV. Costs nothing. */
async function loadCachedProps(){
  try {
    const d = await jget(`/props?week=${S.week}`);
    S.props = d.props || []; S.propsMeta = d;
    store.set('nflslate.props.'+S.week, { props:S.props, meta:d });
  } catch(e){
    const c = store.get('nflslate.props.'+S.week, null);
    if (c) { S.props = c.props; S.propsMeta = c.meta; }
  }
  render();
}

/* The only call that can spend credits. */
async function pullOdds(force){
  S.pulling = true; render();
  try {
    const d = await jget(`/props?week=${S.week}${force?'&force=1':''}`);
    S.props = d.props || []; S.propsMeta = d;
    store.set('nflslate.props.'+S.week, { props:S.props, meta:d });
  } catch(e){ S.err = e.message; }
  S.pulling = false; render();
  if (!S.err) logBoard();
}

/* ===================================================================== */
/* RESULT LOGGING                                                         */
/* Every board edge is sent to the worker after an odds pull. The worker  */
/* keeps the first sighting (price, model %, fair %) and keeps updating   */
/* the closing price on later pulls until kickoff. The nightly build      */
/* grades them into data/results-<season>.json.                           */
/* ===================================================================== */
const LOG_KEY = 'forkball-log-1';
async function jpost(path, body){
  const r = await fetch(WORKER.replace(/\/+$/,'') + path, { method:'POST',
    headers:{ 'Content-Type':'application/json', 'X-Log-Key':LOG_KEY }, body:JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || (path + ' → ' + r.status));
  return d;
}
const playId = (player, market, dir, line) => `${normName(player)}|${market}|${dir}|${line}`;
let _pidMap = null;
function pidOf(name){
  if (!_pidMap || _pidMap.src !== S.pRates) {
    _pidMap = new Map(); _pidMap.src = S.pRates;
    for (const src of [S.pPrior, S.pRates]) for (const [id, p] of Object.entries(src.players || {})) _pidMap.set(normName(p.name), id);
  }
  return _pidMap.get(normName(name)) || null;
}
function playOf(e){
  const p = e.prop, b = e.best;
  return { player:p.player, pid:pidOf(p.player), market:p.market, dir:b.dir, line:p.line,
    price:b.price, book:b.book || null, game:p.game, game_id:e.game.game_id, commence:p.commence || null,
    p:R(b.p,4), fair:R(b.fair,4), ev:R(b.ev,2), pts:R(b.pts,2), mean:R(e.pj.mean,1), w:R(e.w,3), opp:Math.round(e.opp),
    badges:e.badges.map(x => x[1]),
    settings:{ minev:S.minev, trust:S.trust, anchor:S.anchor, oline:S.olineImp, lastn:S.lastn } };
}
/** The board as it stands, across ALL markets (the chip filter is a view, not a verdict). */
function boardEdges(){
  if (!S.props.length || S.dataErr.length) return [];
  if (!Object.keys(S.pPrior.players || {}).length || !Object.keys(S.pRates.players || {}).length) return [];
  const keep = S.mktFilter; S.mktFilter = new Set(Object.keys(MKT));
  try { return buildEdges().priced || []; } finally { S.mktFilter = keep; }
}
async function logBoard(){
  const plays = boardEdges().map(playOf);
  S.logErr = null;
  try {
    if (plays.length) await jpost('/plays', { season:SEASON, week:S.week, plays });
    await loadLogged();
  } catch(e){ S.logErr = e.message; render(); }
}
async function loadLogged(){
  try {
    const d = await jget(`/plays?season=${SEASON}&week=${S.week}`);
    S.logged = new Map((d.plays || []).map(p => [p.id, p]));
  } catch(e){ S.logged = new Map(); }
  render();
}
async function toggleBet(i){
  const e = _edges[i]; if (!e) return;
  const pl = playOf(e), id = playId(pl.player, pl.market, pl.dir, pl.line);
  const cur = S.logged.get(id), bet = !(cur && cur.bet);
  const btn = $('betBtn'); if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    await jpost('/plays/bet', { season:SEASON, week:S.week, play:pl, bet });
    S.logged.set(id, Object.assign({}, cur || pl, { id, bet, source: cur ? cur.source : 'manual' }));
    S.rec = null;                                  // record tab refetches
  } catch(e){ alert('Could not save: ' + e.message); }
  openEdge(i); render();
}

async function loadWeather(){
  const out = S.games.filter(g => {
    const roof = (g.roof||'').toLowerCase();
    return roof !== 'dome' && roof !== 'closed' && COORDS[g.home] && g.location !== 'Neutral';
  });
  await Promise.all(out.map(async g => {
    const c = COORDS[g.home], hour = (g.gametime||'13:00').slice(0,2);
    try{
      const u = `https://api.open-meteo.com/v1/forecast?latitude=${c[0]}&longitude=${c[1]}`
        + `&hourly=wind_speed_10m,temperature_2m,precipitation_probability`
        + `&wind_speed_unit=mph&temperature_unit=fahrenheit&start_date=${g.gameday}&end_date=${g.gameday}`;
      const r = await fetch(u); if (!r.ok) return;
      const d = await r.json();
      const i = d.hourly.time.findIndex(t => t.startsWith(`${g.gameday}T${hour}`));
      if (i < 0) return;
      S.wx[g.game_id] = { wind:Math.round(d.hourly.wind_speed_10m[i]),
                          temp:Math.round(d.hourly.temperature_2m[i]),
                          precip:d.hourly.precipitation_probability ? d.hourly.precipitation_probability[i] : null };
    }catch(e){}
  }));
  render();
}

async function load(){
  S.loading = true; S.err = null; render();
  try { if (!META) await loadMeta(); if (!S.weeks.length) await loadWeeks(); await loadAll(); }
  catch(e){ S.err = e.message; }
  S.loading = false; render();
}

/* ===================================================================== */
/* RENDER                                                                 */
/* ===================================================================== */
function fmtKick(g){
  const p = (g.gametime||'13:00').split(':').map(Number);
  const ap = p[0] >= 12 ? 'PM':'AM', hh = p[0]%12 === 0 ? 12 : p[0]%12;
  return `${(g.weekday||'').slice(0,3)} ${hh}:${String(p[1]).padStart(2,'0')} ${ap} ET`;
}
function spreadTxt(g){
  if (g.spread === null) return '—';
  return g.spread > 0 ? `${g.home} -${g.spread}` : g.spread < 0 ? `${g.away} -${Math.abs(g.spread)}` : 'PK';
}
const evColor = v => v >= 6 ? 'var(--gr)' : v >= 3 ? 'var(--g)' : v >= 0 ? 'var(--y)' : 'var(--t3)';
const am = v => v === null||v === undefined ? '—' : (v > 0 ? '+'+v : ''+v);

function edgeRow(e, i){
  const p = e.prop, b = e.best;
  return `<div class="erow ${b.dir}" data-e="${i}">
    <div class="e-main">
      <div class="e-top">
        <span class="e-name">${p.player}</span>
        <span class="e-mkt">${MKT[p.market].label}</span>
        <span class="e-dir ${b.dir}">${b.dir.toUpperCase()} ${p.line}</span>
      </div>
      <div class="e-sub">proj <b>${R(e.pj.mean,1)}</b> · <span class="glink" data-g="${e.game.game_id}" title="Open game page">${p.game} ›</span> · ${am(b.price)}${b.book?' '+b.book:''}
        · model ${Math.round(b.p*100)}% vs fair ${Math.round(b.fair*100)}% · ${Math.round(e.opp)} opp, ${Math.round(e.w*100)}% weight</div>
      ${e.badges.length?`<div class="bdgs">${e.badges.map(x=>`<span class="bdg ${x[0]}">${x[1]}</span>`).join('')}</div>`:''}
    </div>
    <div class="e-num">
      <div class="e-ev" style="color:${evColor(b.ev)}">${b.ev>0?'+':''}${R(b.ev,1)}%</div>
      <div class="e-pts">${b.pts>0?'+':''}${R(b.pts,1)} pts</div>
    </div>
  </div>`;
}

/* ---- slate card signals: why this game is worth opening ---- */
let _slateEdges = {};
function edgeCounts(){
  const n = {};
  if (!S.props.length) return n;
  for (const e of buildEdges().priced) n[e.game.game_id] = (n[e.game.game_id] || 0) + 1;
  return n;
}
/** Per-team injury chip: "PIT 2 out · 1 Q" (game statuses) or "CIN 3 DNP" (practice, before
    statuses post). Red = a regular is out or doubtful; amber = questionable or missed practice.
    Limited practice is left off the card (nearly every team has some midweek) — it's on the game page. */
function injChips(g){
  if (!S.gd) return S.gdErr ? [] : [['', 'injuries …']];
  const list = notableInjuries(g), out = [];
  for (const t of [g.away, g.home]) {
    const xs = list.filter(i => i.team === t && !i.tier.rest && i.tier.k <= 3);
    if (!xs.length) continue;
    const c = k => xs.filter(i => i.tier.k === k).length;
    const o = c(0) + c(1), q = c(2), dnp = c(3);
    const txt = [o && `${o} out`, q && `${q} Q`, dnp && `${dnp} DNP`].filter(Boolean).join(' · ');
    const qbs = xs.filter(i => i.position === 'QB' && i.tier.k <= 3);
    out.push([o ? 'a' : 'd', `${t} ${txt}`]);
    for (const qb of qbs) out.push(['a', `QB ${qb.name.split(' ').slice(-1)[0]} ${qb.tier.tag}`]);
  }
  return out;
}
/** Sort weight: out/doubtful regulars count most, then DNP, then Q, then limited. */
function injWeight(g){
  if (!S.gd) return 0;
  const w = [3, 3, 1.5, 2, 0.5];
  return notableInjuries(g).reduce((s, i) => s + (w[i.tier.k] || 0) * (i.position === 'QB' ? 3 : 1), 0);
}

function card(g){
  const p = project(g), hotH = p.home.att >= p.away.att;
  const nE = _slateEdges[g.game_id] || 0;
  const wx = S.wx[g.game_id], c = [...injChips(g)];
  if (p.wf.indoor) c.push(['','dome']);
  else if (wx && wx.wind >= 13) c.push(['w',wx.wind+' mph wind']);
  else if (wx) c.push(['',wx.wind+' mph · '+wx.temp+'°']);
  if (g.div_game) c.push(['','div']);
  if (g.location === 'Neutral') c.push(['o','neutral']);
  for (const t of [g.home,g.away]) if (S.oline[t] && S.oline[t].severity >= 0.3)
    c.push(['a', t+' o-line']);
  if (p.disagree !== null && Math.abs(p.disagree) >= 4)
    c.push(['a','model '+(p.disagree>0?'+':'')+R(p.disagree,1)]);
  return `<div class="card" data-id="${g.game_id}">
    <div class="c-top"><div><div class="matchup">${g.away}<span class="at">@</span>${g.home}</div>
      <div class="kick">${fmtKick(g)}</div></div>
      <div class="comp">${S.props.length
        ? `<div class="comp-v" style="color:${nE ? 'var(--g)' : 'var(--t3)'}">${nE || '—'}</div><div class="comp-l">${nE === 1 ? 'edge' : 'edges'}</div>`
        : `<div class="comp-l" style="margin-top:0">no odds</div>`}</div></div>
    <div class="lines">
      <div class="line"><div class="k">spread</div><div class="v">${spreadTxt(g)}</div></div>
      <div class="line"><div class="k">total</div><div class="v">${g.total===null?'—':g.total}</div></div>
      <div class="line"><div class="k">plays</div><div class="v">${R(p.plays,0)}</div></div></div>
    <div class="teams">${[[p.away,!hotH],[p.home,hotH]].map(x=>`
      <div class="tm ${x[1]?'hot':''}">
        <div class="tm-n"><span>${x[0].team}</span><span class="pts">${R(x[0].pts,1)}</span></div>
        <div class="tm-r"><span>pass att</span><span>${R(x[0].att,0)}</span></div>
        <div class="tm-r"><span>pass yds</span><span>${R(x[0].pass_yards,0)}</span></div>
        <div class="tm-r"><span>carries</span><span>${R(x[0].carries,0)}</span></div>
        <div class="tm-r"><span>rush yds</span><span>${R(x[0].rush_yards,0)}</span></div>
      </div>`).join('')}</div>
    <div class="chips" style="align-items:center">${c.map(x=>`<span class="chip ${x[0]}">${x[1]}</span>`).join('')}<span class="card-go">Game page ›</span></div>
  </div>`;
}

/* The nightly build only commits when data changes, so "old" isn't the warning —
   "a week has been final for 2 days and the stats still don't include it" is. */
function dataAgeTxt(){
  if (!META) return '<span class="stale">no nightly data — using worker</span>';
  const built = META.generated ? Math.round((Date.now() - Date.parse(META.generated)) / 3600000) : null;
  const age = built === null ? '?' : built < 1 ? 'just now' : built < 48 ? built + 'h ago' : Math.round(built/24) + 'd ago';
  const cutoff = Date.now() - 2*86400000;
  const final = S.weeks.filter(w => w.played === w.games && w.games && Date.parse(w.last) < cutoff)
                       .reduce((m, w) => Math.max(m, w.week), 0);
  const behind = META.stats_through_week !== null && final > (META.stats_through_week || 0);
  return `<span class="${behind ? 'stale' : ''}">data thru wk ${META.stats_through_week ?? '—'} · built ${age}`
       + (behind ? ` — week ${final} is final but not in the stats; check the Actions tab` : '') + `</span>`;
}

let _edges = null;
function render(){
  $('wLbl').textContent = S.week ? 'Week '+S.week : 'Week —';
  $('minevV').textContent = (S.minev>0?'+':'')+S.minev.toFixed(1)+'%';
  $('anchorV').textContent = S.anchor+'%'; $('anchorV2').textContent = S.anchor+'%';
  $('olineV').textContent = S.olineImp+'%';
  $('trustV').textContent = S.trust+'%';
  $('anchor').value = S.anchor; $('anchor2').value = S.anchor;
  $('ctrlEdges').style.display = S.tab === 'edges' && !S.game ? '' : 'none';
  $('ctrlSlate').style.display = S.tab === 'slate' && !S.game ? '' : 'none';
  $('bPull').disabled = S.pulling || S.loading;
  $('bPull').textContent = S.pulling ? '↓ pulling…' : '↓ Pull odds';

  if (!$('mktChips').children.length) {
    $('mktChips').innerHTML = Object.keys(MKT).map(k =>
      `<span class="fchip on" data-m="${k}">${MKT[k].label}</span>`).join('');
    $('mktChips').onclick = ev => {
      const el = ev.target.closest('.fchip'); if (!el) return;
      const m = el.dataset.m;
      if (S.mktFilter.has(m)) S.mktFilter.delete(m); else S.mktFilter.add(m);
      el.classList.toggle('on'); render();
    };
  }

  if (S.loading){ $('status').innerHTML = '<span class="spin"></span> loading…'; $('main').innerHTML=''; return; }
  if (S.err){
    $('status').innerHTML = `<span style="color:var(--r)">✕ ${S.err}</span>`;
    $('main').innerHTML = `<div class="empty">Couldn't reach the worker.<br><br>
      Set the URL with ⚙ · currently <code>${WORKER}</code></div>`;
    return;
  }

  const conf = S.games.length ? S.games.reduce((s,g)=>s+confidence(g),0)/S.games.length : 0;
  const curN = (S.rates.teams && S.games[0] && S.rates.teams[S.games[0].home]
                && S.rates.teams[S.games[0].home].offense)
             ? S.rates.teams[S.games[0].home].offense.games : 0;
  let oddsTxt = '<span class="stale">no odds pulled</span>';
  if (S.propsMeta){
    const mins = Math.round((S.propsMeta.age_s||0)/60);
    const stale = mins > 90;
    oddsTxt = `<span class="${stale?'stale':''}">odds ${mins<1?'just now':mins+'m ago'}`
            + ` · ${S.props.length} props`
            + (S.propsMeta.credits_remaining!==null&&S.propsMeta.credits_remaining!==undefined
               ? ` · ${S.propsMeta.credits_remaining} credits left`:'')+`</span>`;
  }
  if (S.logged.size) oddsTxt += `<span>${S.logged.size} logged${[...S.logged.values()].some(p => p.bet) ? ' · '+[...S.logged.values()].filter(p => p.bet).length+' bet' : ''}</span>`;
  if (S.logErr) oddsTxt += `<span style="color:var(--r)">✕ logging failed (${S.logErr}) — redeploy the worker?</span>`;
  $('status').innerHTML = `<span>${S.games.length} games</span>
    <span>confidence <span class="conf-bar"><span class="conf-fill" style="width:${Math.round(conf*100)}%"></span></span> ${Math.round(conf*100)}%</span>
    <span>priors ${PRIOR_SEASON} · ${Object.keys(S.pPrior.players||{}).length} players · current ${curN}g</span>
    <span>${S.injuries.length} on injury report · roster ${S.roster.week ? 'wk '+S.roster.week : '—'}</span>
    ${dataAgeTxt()}${oddsTxt}`
    + (S.dataErr.length ? `<span style="color:var(--r);font-weight:600">✕ ${S.dataErr.join(' · ')} — board unreliable, press ↺</span>` : '');

  if (S.game){ renderGame(); return; }

  if (S.tab === 'record'){ renderRecord(); return; }

  if (S.tab === 'slate'){
    loadGameData();                                    // snap shares decide which injuries are notable
    _slateEdges = edgeCounts();
    const key = { time:g=>g.gameday+' '+g.gametime,
                  edges:g=>-(_slateEdges[g.game_id]||0),
                  inj:g=>-injWeight(g),
                  total:g=>-(g.total||0) }[S.sort] || (g=>g.gameday+' '+g.gametime);
    const sorted = [...S.games].sort((a,b)=>{const x=key(a),y=key(b);return x<y?-1:x>y?1:0;});
    $('main').innerHTML = S.games.length
      ? `<div class="grid">${sorted.map(card).join('')}</div>`
      : '<div class="empty">No games this week.</div>';
    document.querySelectorAll('.card').forEach(el => el.onclick = () => openGame(el.dataset.id));
    return;
  }

  // edges
  if (!S.props.length){
    $('main').innerHTML = `<div class="empty"><b>No odds loaded for Week ${S.week}.</b><br><br>
      Press <b>↓ Pull odds</b> to fetch player props.<br>
      That's the only action that spends API credits — roughly 4 per game.</div>`;
    return;
  }
  const noPrior = !Object.keys(S.pPrior.players || {}).length, noCur = !Object.keys(S.pRates.players || {}).length;
  if (noPrior || noCur){
    _edges = [];
    $('main').innerHTML = `<div class="empty"><b>Board withheld.</b><br><br>
      ${noPrior ? PRIOR_SEASON+' player priors' : SEASON+' player rates'} didn't load, so every player would
      fall back to a position default and the edges would be fiction.<br>Press ↺ to retry.</div>`;
    return;
  }
  const res = buildEdges();
  _edges = res.priced;
  if (!res.priced.length){
    $('main').innerHTML = calHtml(res.cal) + `<div class="empty"><b>Nothing clears +${S.minev}% EV this week.</b><br><br>
      ${res.all.length} props priced, none with an edge worth taking.<br>
      ${res.suspect.length?res.suspect.length+' quarantined as implausible. ':''}${res.lowvol.length?res.lowvol.length+' excluded as low volume.':''}<br>
      In September this is the expected answer — two games of data against a sharp market
      shouldn't produce edges.<br>
      Lower the threshold to see what's close, or leave it — a flat week is a real answer.</div>`;
    return;
  }
  $('main').innerHTML = calHtml(res.cal) + `<div class="sechead">${res.priced.length} edges ≥ +${S.minev}% EV
      <span style="float:right;text-transform:none;letter-spacing:0">of ${res.all.length} priced</span></div>`
    + res.priced.map(edgeRow).join('')
    + (res.lowvol.length ? `<div class="sechead">${res.lowvol.length} excluded as low volume
        <span style="float:right;text-transform:none;letter-spacing:0;color:var(--t3)">
        projected below a bettable floor</span></div>
      <div class="note" style="margin-bottom:10px">Deep reserves and situational players. The
        projection can't be trusted at this volume and plus-money prices inflate the EV.</div>` : '')
    + (res.suspect.length ? `<div class="sechead" style="color:var(--r)">
        ${res.suspect.length} quarantined — raw model over 90% confident
        <span style="float:right;text-transform:none;letter-spacing:0;color:var(--t3)">
        almost always a bad input, not an edge</span></div>
      <div class="note" style="margin-bottom:10px">These are excluded from the board.
        A projection that disagrees this violently with a posted line usually means the player's
        role changed, the line is an odd rung, or the name matched the wrong player.</div>` : '');
  document.querySelectorAll('.erow').forEach(el => el.onclick = ev => {
    const gl = ev.target.closest('.glink');
    if (gl) { ev.stopPropagation(); openGame(gl.dataset.g); return; }
    openEdge(+el.dataset.e);
  });
}

/* ---------- record tab ---------- */
/* Plays come live from the worker (so bets and new plays show at once); grades come
   from the nightly results file. CLV is recomputed here so pending plays show it too. */
async function loadRecord(){
  S.recErr = null;
  const [live, graded] = await Promise.all([
    jget(`/plays?season=${SEASON}`).catch(e => { S.recErr = 'worker: ' + e.message; return { plays:[] }; }),
    fetch(`./data/results-${SEASON}.json?v=${encodeURIComponent((META && META.generated) || Date.now())}`)
      .then(r => r.ok ? r.json() : { plays:[] }).catch(() => ({ plays:[] })),
  ]);
  const g = new Map((graded.plays || []).map(p => [p.week + '|' + p.id, p]));
  const all = new Map();
  for (const p of graded.plays || []) all.set(p.week + '|' + p.id, p);
  for (const p of live.plays || []) {
    const k = p.week + '|' + p.id, gp = g.get(k);
    all.set(k, gp ? Object.assign({}, p, { result:gp.result, stat:gp.stat, units:gp.units }) : p);
  }
  S.rec = [...all.values()].map(p => {
    const c = p.close || {};
    const clv = (c.line === p.line && c.fair !== null && c.fair !== undefined && p.fair !== null && p.fair !== undefined)
      ? (c.fair - p.fair) * 100 : null;
    const mv = c.line !== undefined && c.line !== null ? c.line - p.line : 0;
    const beat = clv !== null ? (clv > 0.05 ? true : clv < -0.05 ? false : null)
               : mv ? (p.dir === 'over' ? mv > 0 : mv < 0) : null;
    return Object.assign({ result:'pending' }, p, { clv, move:mv, beat });
  }).sort((a,b) => (b.week - a.week) || String(a.commence).localeCompare(String(b.commence)) || a.player.localeCompare(b.player));
  render();
}

function recSummary(list){
  const n = r => list.filter(p => p.result === r).length;
  const W = n('win'), L = n('loss'), P = n('push'), V = n('void'), pend = n('pending');
  const units = list.reduce((s,p) => s + (p.units || 0), 0), risked = W + L + P;
  const cl = list.filter(p => p.clv !== null), bc = list.filter(p => p.beat !== null);
  return { W, L, P, V, pend, units, risked, roi: risked ? units / risked * 100 : null,
           clv: cl.length ? cl.reduce((s,p) => s + p.clv, 0) / cl.length : null, nClv: cl.length,
           beat: bc.length ? bc.filter(p => p.beat).length / bc.length * 100 : null, nBeat: bc.length, n:list.length };
}
const sgn = (v, d=2) => v === null || v === undefined ? '—' : (v > 0 ? '+' : '') + v.toFixed(d);
const upColor = v => v === null ? 'var(--t3)' : v > 0 ? 'var(--gr)' : v < 0 ? 'var(--r)' : 'var(--t2)';

function renderRecord(){
  if (!S.rec) { $('main').innerHTML = '<div class="empty"><span class="spin"></span> loading record…</div>'; loadRecord(); return; }
  const f = S.recFilter;
  const list = S.rec.filter(p => f === 'bets' ? p.bet : p.source !== 'manual');
  const sm = recSummary(list);
  const chips = `<div class="fchips" style="margin-bottom:12px">
      <span class="fchip ${f==='all'?'on':''}" data-rf="all">Model — every board play</span>
      <span class="fchip ${f==='bets'?'on':''}" data-rf="bets">My bets ★</span></div>`;
  const err = S.recErr ? `<div class="warn" style="margin-bottom:10px">Couldn't read live plays (${S.recErr}). Showing the last nightly results only.</div>` : '';
  if (!list.length) {
    $('main').innerHTML = chips + err + `<div class="empty"><b>${f==='bets' ? 'No bets marked yet.' : 'Nothing logged yet.'}</b><br><br>
      ${f==='bets' ? 'Open an edge and tap <b>☆ I bet this</b> to add it here.'
        : 'Every edge on the board is logged automatically when you press <b>↓ Pull odds</b>.<br>Results are graded each morning from nflverse stats.'}</div>`;
    wireRecord(); return;
  }
  const tile = (l, v, sub, col) => `<div class="tile"><div class="tl">${l}</div><div class="tv" style="color:${col||'var(--t)'}">${v}</div><div class="ts">${sub}</div></div>`;
  const tiles = `<div class="tiles">
    ${tile('Record', `${sm.W}–${sm.L}${sm.P?'–'+sm.P:''}`, `${sm.W+sm.L ? Math.round(sm.W/(sm.W+sm.L)*100)+'% wins' : 'no results yet'}${sm.V?' · '+sm.V+' void':''}`)}
    ${tile('Units (1u flat)', sm.risked ? sgn(sm.units)+'u' : '—', sm.roi !== null ? `ROI ${sgn(sm.roi,1)}%` : '—', upColor(sm.risked ? sm.units : null))}
    ${tile('Avg CLV', sm.clv !== null ? sgn(sm.clv,1)+' pts' : '—', `${sm.nClv} with a same-line close`, upColor(sm.clv))}
    ${tile('Beat the close', sm.beat !== null ? Math.round(sm.beat)+'%' : '—', `of ${sm.nBeat} with a close to compare`, sm.beat === null ? null : sm.beat >= 50 ? 'var(--gr)' : 'var(--r)')}
    ${tile('Pending', sm.pend, `${sm.n} logged in all`)}
  </div>
  <div class="note" style="margin:10px 0 4px">Wins and losses take hundreds of plays to mean much.
    <b>CLV</b> — how the price moved between when the play was logged and your last odds pull before kickoff —
    is the faster signal: consistently beating the close says the edges are real even through a losing week.
    The close is only as fresh as your last pull.</div>`;

  const mk = {};
  for (const p of list) (mk[p.market] = mk[p.market] || []).push(p);
  const mrows = Object.keys(MKT).filter(k => mk[k]).map(k => { const m = recSummary(mk[k]);
    return `<tr><td class="nm">${MKT[k].label}</td><td>${m.n}</td><td>${m.W}–${m.L}${m.P?'–'+m.P:''}</td>
      <td style="color:${upColor(m.risked?m.units:null)}">${sgn(m.units)}</td><td>${m.roi!==null?sgn(m.roi,1)+'%':'—'}</td>
      <td style="color:${upColor(m.clv)}">${m.clv!==null?sgn(m.clv,1):'—'}</td><td>${m.beat!==null?Math.round(m.beat)+'%':'—'}</td></tr>`; }).join('');

  const closeTxt = p => { const c = p.close || {};
    if (c.line === undefined || c.line === null) return '—';
    if (c.line !== p.line) return `${c.line} <span style="color:${upColor(p.beat===null?null:p.beat?1:-1)}">(${sgn(p.move,1)})</span>`;
    return am(c.price); };
  const prows = list.map(p => `<tr>
      <td class="nm">${p.bet?'<span class="star">★</span> ':''}${p.player}<div style="font-family:var(--fm);font-weight:400;font-size:10px;color:var(--t3)">wk ${p.week} · ${p.game||''}</div></td>
      <td><span class="e-dir ${p.dir}">${p.dir==='over'?'O':'U'} ${p.line}</span> ${MKT[p.market]?MKT[p.market].label:p.market}</td>
      <td>${am(p.price)}</td>
      <td>${p.p!=null?Math.round(p.p*100):'—'}% / ${p.fair!=null?Math.round(p.fair*100):'—'}%</td>
      <td>${closeTxt(p)}</td>
      <td style="color:${upColor(p.clv)}">${p.clv!==null?sgn(p.clv,1):'—'}</td>
      <td>${p.stat!==null&&p.stat!==undefined?p.stat:'—'}</td>
      <td><span class="res ${p.result}">${p.result}</span></td>
      <td style="color:${upColor(p.units===null||p.units===undefined?null:p.units)}">${p.units!==null&&p.units!==undefined?sgn(p.units):''}</td></tr>`).join('');

  $('main').innerHTML = chips + err + tiles
    + `<div class="sechead">By market</div><div class="rwrap"><table class="rtbl">
        <tr><th>Market</th><th>Plays</th><th>W–L</th><th>Units</th><th>ROI</th><th>CLV</th><th>Beat</th></tr>${mrows}</table></div>`
    + `<div class="sechead">Every play <span style="float:right;text-transform:none;letter-spacing:0">model % / fair % when logged</span></div>
       <div class="rwrap"><table class="rtbl">
        <tr><th>Player</th><th>Play</th><th>Price</th><th>Model/Fair</th><th>Close</th><th>CLV</th><th>Stat</th><th>Result</th><th>Units</th></tr>
        ${prows}</table></div>`;
  wireRecord();
}
function wireRecord(){
  document.querySelectorAll('[data-rf]').forEach(el => el.onclick = () => { S.recFilter = el.dataset.rf; render(); });
}

function usageRows(name, pos){
