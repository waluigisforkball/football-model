name: Nightly data

# Twice a day: early morning ET picks up overnight nflverse stat updates,
# late afternoon ET picks up roster moves (IR, releases) made during the day.
on:
  schedule:
    - cron: '17 10 * * *'   # ~6:17 AM ET
    - cron: '17 21 * * *'   # ~5:17 PM ET
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write            # lets the job commit data/

concurrency:
  group: nightly-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build data files
        run: node scripts/build-data.mjs

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: nightly build $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
